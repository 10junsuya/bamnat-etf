# Argus의 실시간 창구: 앱이 시세를 물으면 숨겨 둔 키로 대신 받아다 줘요.
name = "gnomon-live"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
# 한국투자증권 서버는 9443 포트를 써요. 이 설정이 있어야 그 포트로 갈 수 있어요 (2024-09-02 이후 날짜면 기본으로 켜져 있지만 분명히 적어 둬요)
compatibility_flags = ["allow_custom_ports"]

[vars]
# 브라우저에서 이 서버를 부를 수 있는 앱 주소(쉼표로 여러 개). "*"는 모두 허용이에요.
# 지금은 비공개라 미리보기·바탕화면 파일에서도 열려야 해서 "*"예요.
# 앱을 공개할 때 반드시 노몬 앱 주소만 남겨요 (ops/SECURITY.md 공개 전 점검표).
ALLOW_ORIGINS = "*"
# 긴급 정지 스위치 (ops/INCIDENT.md). 평소 "0". 배포 화면에서 lockdown을 켜면 "1"로 올라가요.
MAINTENANCE = "0"

# Cloudflare 로그: 차단 기록(무엇이 왜 막혔는지)을 볼 수 있어요. IP 같은 개인 정보는 코드에서 남기지 않아요.
[observability]
enabled = true

# 2분마다 서버가 스스로 한국투자증권 시세를 미리 받아 저장소(KV, 배포 때 연결)에 넣어 둬요 → 앱은 열자마자 /snap 한 번으로 받아요
[triggers]
crons = ["*/2 * * * *"]
