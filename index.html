<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밤낮 ETF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 휴대폰 폭 한 줄 카드 스택. 상단 고정 시계 → 탭 → 화면별 카드. 한국 시간에 따라 낮/밤 테마 전환 */
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --surface-2:#EDF0EA; --ink:#14191D; --muted:#5D666C; --line:#DCE1DA;
  --accent:#0E7A6C; --accent-soft:#DDF0EC; --up:#D3302C; --down:#2260C4; --warn:#9A6400;
  --font:"IBM Plex Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r:14px;
}
body[data-mode="dark"]{
  --bg:#0C1117; --surface:#141B24; --surface-2:#1B2430; --ink:#E8EDF1; --muted:#8F9CA8; --line:#24303C;
  --accent:#4FC2AE; --accent-soft:#163631; --up:#FF5C57; --down:#5E9DFF; --warn:#E7B04A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; transition:background .4s, color .4s}
body[data-mode="dark"]{color-scheme:dark} body[data-mode="light"]{color-scheme:light}
button,select,input{font:inherit; color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

.app{max-width:680px; margin:0 auto; padding:0 16px 40px}

/* 상단 고정 영역 */
.top{position:sticky; top:0; z-index:20; background:var(--bg); padding:12px 0 0; border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand h1{font-size:18px; margin:0; letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.mode-btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:13px}
.clocks{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.clock{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 12px; text-align:left; cursor:pointer; display:block; width:100%}
.clock:hover{border-color:var(--accent)}
.cmore{font-size:11px; color:var(--accent); margin-left:2px}
.hnext{background:var(--accent-soft); border-radius:14px; padding:14px 16px; margin:12px 0 4px}
.hnext .d{font-size:24px; font-weight:700}
.hrow{display:grid; grid-template-columns:96px 1fr auto; gap:10px; padding:11px 0; border-top:1px solid var(--line); align-items:baseline}
.hrow .dd{font-weight:600}
.hrow .why{line-height:1.4}
.hrow .why small{display:block; color:var(--muted); font-size:13px}
.hmonth{font-size:13px; color:var(--muted); font-weight:600; margin:14px 0 2px}
.dst-bar{display:grid; grid-template-columns:repeat(12,1fr); gap:2px; margin-top:8px}
.dst-bar span{height:26px; border-radius:4px; background:var(--surface-2); position:relative; overflow:hidden}
.dst-bar span i{position:absolute; top:0; bottom:0; background:var(--accent); opacity:.85}
.dst-lbl{display:grid; grid-template-columns:repeat(12,1fr); gap:2px; font-size:11px; color:var(--muted); text-align:center; margin-top:2px}
.ttable{width:100%; border-collapse:collapse; margin-top:8px; font-size:15px}
.ttable th,.ttable td{padding:8px 6px; border-top:1px solid var(--line); text-align:left}
.ttable th{font-size:13px; color:var(--muted); font-weight:600}
.clock .city{font-size:12px; color:var(--muted)}
.clock .time{font-size:17px; font-weight:600}
.pill{display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.pill.live{background:var(--accent-soft); color:var(--accent)}
.tabs{display:flex; gap:4px; margin-top:10px; overflow-x:auto}
.tab{flex:1; min-width:max-content; border:0; background:none; padding:10px 8px; cursor:pointer; color:var(--muted); font-weight:500; border-bottom:2px solid transparent}
.tab[aria-current="page"]{color:var(--ink); border-bottom-color:var(--ink)}

.banner{margin:14px 0 0; padding:10px 12px; border-radius:12px; background:var(--surface-2); font-size:13px; color:var(--muted)}

section.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-top:12px}
.card h2{font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:6px; text-wrap:balance}
.card h2 .sub{margin-left:auto; font-weight:400; font-size:12px; color:var(--muted)}
.qbtn{border:1px solid var(--line); background:none; width:20px; height:20px; border-radius:50%; font-size:12px; line-height:1; cursor:pointer; color:var(--muted); padding:0}

/* 홈 */
.strip{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.tile .lbl{font-size:12px; color:var(--muted)} .tile .val{font-weight:600; font-size:16px}
.list-title{display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 0}
.list-title h3{margin:0; font-size:15px}
.etf-card{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-top:8px; cursor:pointer}
.etf-card:hover{border-color:var(--muted)}
.etf-card .nm{font-weight:600; line-height:1.35}
.etf-card .meta{font-size:12px; color:var(--muted)}
.etf-card .chg{font-size:22px; font-weight:700; text-align:right}
.etf-card .est{font-size:12px; text-align:right; color:var(--muted)}

/* 상세 */
.back{display:flex; align-items:center; gap:8px; margin-top:14px}
.icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; height:36px; min-width:36px; cursor:pointer; padding:0 10px}
.back .title{flex:1; min-width:0}
.back .title b{display:block; line-height:1.3}
.star[aria-pressed="true"]{color:#E2A50B}
.hero{text-align:center; padding:24px 16px 20px}
.hero .lbl{font-size:13px; color:var(--muted)}
.hero .big{font-size:52px; font-weight:700; line-height:1.1; margin:6px 0 6px; letter-spacing:-.02em}
.hero .price{font-size:17px; font-weight:600}
.hero .basis{font-size:12px; color:var(--muted); margin-top:4px}
.split{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px}
.split div{background:var(--surface-2); border-radius:10px; padding:8px; font-size:13px}
.split b{display:block; font-size:16px}
.note{font-size:12px; color:var(--muted); margin-top:10px}
.state-line{font-size:16px; font-weight:600}
.callout{margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--surface-2); font-size:13px}
.kv{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.kv div{background:var(--surface-2); border-radius:10px; padding:8px 10px}
.kv .k{font-size:12px; color:var(--muted)} .kv .v{font-weight:600}

.seg{display:flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px; margin-bottom:8px}
.seg button{flex:1; border:0; background:none; border-radius:8px; padding:6px 4px; cursor:pointer; font-size:13px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08)}

.row{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:10px 2px; border-top:1px solid var(--line); width:100%; background:none; border-left:0; border-right:0; border-bottom:0; text-align:left; cursor:pointer}
.row:first-of-type{border-top:0}
.row .n{font-weight:500} .row .t{font-size:13px; color:var(--muted)}
.row .r1{text-align:right; font-weight:600} .row .r2{text-align:right; font-size:12px; color:var(--muted)}
.row.total{cursor:default; font-weight:600}
.wbar{height:3px; border-radius:2px; background:var(--accent); opacity:.45; margin-top:4px}
.more{display:block; width:100%; margin-top:8px; padding:10px; border:1px dashed var(--line); background:none; border-radius:10px; cursor:pointer; color:var(--muted)}

.logo{width:34px; height:34px; border-radius:50%; display:inline-grid; place-items:center; font-size:11px; font-weight:700; color:#fff; letter-spacing:-.02em; flex:none}
.logo.sm{width:28px; height:28px; font-size:9px}
.evtype{font-size:11px; font-weight:600; padding:1px 6px; border-radius:6px; background:var(--surface-2); color:var(--muted); margin-right:4px}
.with-logo{display:flex; align-items:center; gap:10px; min-width:0}
.search{position:relative; margin-top:14px}
.search input{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 40px 12px 14px; font-size:15px}
.search .clear{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:none; cursor:pointer; color:var(--muted); font-size:16px; padding:4px 8px}
details.cat{border-top:1px solid var(--line)} details.cat:first-child{border-top:0}
details.cat summary::-webkit-details-marker{display:none}
details.cat[open] summary b::after{content:" ▴"; color:var(--muted); font-weight:400}
details.cat:not([open]) summary b::after{content:" ▾"; color:var(--muted); font-weight:400}
.hit{font-size:12px; color:var(--accent); margin-top:2px}
.ev{display:grid; grid-template-columns:48px 34px 1fr; gap:10px; align-items:start; padding:10px 0; border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev .d{font-weight:600; font-size:13px}
.ev .d small{display:block; font-weight:400; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
.chip{font-size:12px; padding:1px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
.chip.mine{background:var(--accent-soft); color:var(--accent)}
.news{padding:10px 0; border-top:1px solid var(--line)} .news:first-of-type{border-top:0}
.tag{font-size:11px; font-weight:600; padding:1px 6px; border-radius:6px; background:var(--surface-2); margin-right:6px}

/* 아침 브리핑 */
.brief{border:1px solid var(--accent); background:linear-gradient(180deg, var(--accent-soft), var(--surface) 140px)}
.brief .total{font-size:26px; font-weight:700; margin:2px 0}
.bsec{border-top:1px solid var(--line); padding-top:12px; margin-top:14px}
.bsec h4{margin:0 0 6px; font-size:15px; display:flex; gap:8px; align-items:baseline}
.bsec h4 .r{margin-left:auto}
.bline{display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:start; padding:7px 0}
.bline .why{font-size:13px; color:var(--muted); margin-top:2px}
.major{font-size:11px; font-weight:700; color:var(--warn); border:1px solid var(--warn); border-radius:6px; padding:0 5px; margin-left:4px}
details.rest summary{cursor:pointer; color:var(--muted); font-size:13px; padding:6px 0}
textarea.code{width:100%; min-height:64px; border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:8px; font-family:ui-monospace,monospace; font-size:12px; color:var(--ink)}

/* 메인 화면 */
.landing{padding:28px 0 8px}
.landing h2{font-size:22px; margin:0 0 4px; text-wrap:balance}
.top.bare{border-bottom:0}
.landing.main{padding-top:9vh}
.landing.main h2{font-size:26px}
.lgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:24px}
.lcard{display:flex; flex-direction:column; gap:10px; text-align:left; cursor:pointer; min-height:300px;
  background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px 16px}
.lcard:hover{border-color:var(--accent)}
.lcard .lt{font-size:24px; font-weight:700; letter-spacing:-.01em}
.lcard .ls{font-size:15px; color:var(--muted); line-height:1.5}
.lcard .lfoot{margin-top:auto; font-size:14px}
.lcard.soon{border-style:dashed}
.backmain{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 10px; cursor:pointer; font-size:13px}
/* A */
.agrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.acard{display:flex; flex-direction:column; gap:6px; text-align:left; cursor:pointer; min-height:170px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px 16px}
.acard:hover{border-color:var(--accent)}
.acard .t{font-size:19px; font-weight:700; line-height:1.3}
.acard .c{font-size:13px; color:var(--accent); font-weight:600}
.acard .s{font-size:14px; color:var(--muted); line-height:1.5}
.acard .f{margin-top:auto; font-size:13px}
.acard.wide{grid-column:1/-1; min-height:0}
.cc{display:inline-block; vertical-align:2px; margin-left:6px; font-size:11px; font-weight:600; padding:0 6px; border-radius:6px; border:1px solid var(--line); color:var(--muted)}
.chip.slow{background:transparent; border:1px dashed var(--line)}
.trio.sm .v{font-size:17px}
.trio.sm div{padding:8px}
.lprev{margin-top:12px; background:var(--accent-soft); border-radius:14px; padding:10px 12px}
.lprev .lp-t{font-size:13px; font-weight:600; color:var(--accent)}
.lprev .lp-c{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center}
.lprev .chip{border:0; cursor:pointer; font-size:13px; padding:4px 10px; background:var(--surface); color:var(--ink)}
.lprev .lp-more{border:0; background:transparent; color:var(--accent); font:inherit; font-size:13px; font-weight:600; cursor:pointer; margin-left:auto; padding:4px 2px}
.irow.ind .top{align-items:center}
.irow.ind .vrow{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 12px; margin-top:6px}
.irow.ind .val{margin-left:0; font-size:34px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
.irow.ind .vs{font-size:14px; color:var(--muted)} .irow.ind .vs.up{color:var(--up)} .irow.ind .vs.down{color:var(--down)}
.irow.ind .one{margin-top:8px}
.zc{margin-left:auto; font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; white-space:nowrap; color:var(--ink); background:color-mix(in srgb, var(--zc) 24%, transparent); border:1px solid color-mix(in srgb, var(--zc) 55%, transparent)}
.hnext.sm{padding:10px 14px} .hnext.sm .d{font-size:18px}
.acard.hl{border-color:var(--accent); background:var(--accent-soft)}
.mpick{display:flex; gap:14px; overflow-x:auto; padding:2px 2px 8px; margin-top:4px; scrollbar-width:thin}
.mpick-g{display:flex; align-items:center; gap:6px; flex:none} .mpick-g .tiny{margin-right:2px; white-space:nowrap}
.mpick .chip{border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:13px; padding:4px 10px; white-space:nowrap; color:var(--ink)}
.mpick .chip.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.mgrp{margin-top:6px} .mg-t{font-size:13px; font-weight:600; color:var(--muted); margin:8px 2px 4px}
.mnode{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:8px; font:inherit; color:inherit; cursor:pointer}
.mnode:hover{border-color:var(--accent)} .mnode .lt{display:flex; justify-content:space-between; align-items:center; gap:8px}
.mnode .mv{font-size:22px; font-weight:700; margin:2px 0}
.marr{text-align:center; color:var(--accent); font-size:20px; line-height:1; margin:8px 0 0}
.mcenter{margin-top:8px; text-align:center; background:var(--surface); border:2px solid var(--accent); border-radius:18px; padding:16px}
.mcenter .nm{font-size:18px; font-weight:700; margin-top:2px} .mcenter .big{font-size:44px; font-weight:700; letter-spacing:-.02em; line-height:1.15; margin:4px 0 6px}
.mcenter .zc{margin-left:0}
.cbox{margin-top:14px; background:var(--surface-2); border-radius:14px; padding:10px 10px 8px}
.cbar{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 2px 4px; min-height:28px}
.cper{display:inline-flex; gap:2px; background:var(--surface); border-radius:9px; padding:2px; flex:none}
.cper button{border:0; background:transparent; font:inherit; font-size:13px; padding:3px 10px; border-radius:7px; color:var(--muted); cursor:pointer}
.cper button.on{background:var(--accent); color:#fff; font-weight:600}
.clegend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin:2px 4px 4px} .clegend i{display:inline-block; width:10px; height:10px; border-radius:3px; opacity:.6; margin-right:4px; vertical-align:-1px}
svg.ichart{display:block; touch-action:pan-y; cursor:crosshair}
details.more{margin-top:18px; border-top:1px solid var(--line)}
details.more summary{cursor:pointer; list-style:none; padding:14px 2px; font-weight:700; color:var(--accent)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ▾"} details.more[open] summary::after{content:" ▴"}
details.more summary span{font-weight:400; color:var(--muted); font-size:14px}
.flow{margin-top:12px; background:var(--surface-2); border-radius:14px; padding:12px 14px}
.flow .fl{display:flex; justify-content:space-between; gap:10px; font-size:15px} .flow .ar{color:var(--muted); font-size:12px; padding-left:4px; line-height:1.4}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; background:var(--surface-2); border-radius:12px; padding:4px}
.seg button{border:0; background:transparent; border-radius:9px; padding:7px 4px; font:inherit; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; line-height:1.25}
.seg button small{display:block; font-size:11px; font-weight:400}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line)}
.lrow{display:block; width:100%; text-align:left; background:transparent; border:0; border-top:1px solid var(--line); padding:12px 0; font:inherit; color:inherit; cursor:pointer}
.lrow.me{cursor:default}
.lrow .lt{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:2px}
.dir{font-size:12px; padding:1px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); white-space:nowrap}
.dir.opp{background:var(--surface-2); color:var(--ink)} .dir.lead,.dir.lag{background:transparent; border:1px solid var(--accent)}
.dots{display:inline-flex; gap:3px; vertical-align:-1px} .dots i{width:8px; height:8px; border-radius:50%; background:var(--line)} .dots i.on{background:var(--accent)}
.irow{display:block; width:100%; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:10px}
.irow:hover{border-color:var(--accent)}
.irow .top{display:flex; align-items:baseline; gap:10px}
.irow .nm{font-size:17px; font-weight:700}
.irow .val{margin-left:auto; font-size:20px; font-weight:700; white-space:nowrap}
.irow .one{font-size:14px; color:var(--muted); margin-top:4px}
.irow .meta{font-size:13px; margin-top:8px; display:flex; flex-wrap:wrap; gap:6px}
.trio{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.trio div{background:var(--surface-2); border-radius:12px; padding:10px; text-align:center}
.trio .k{font-size:13px; color:var(--muted)} .trio .v{font-size:22px; font-weight:700}
.react{display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:15px}
.react div:nth-child(even){text-align:right; font-weight:600}
/* 지표 게이지 */
.gauge{position:relative; margin:26px 0 6px}
.gauge .bar{display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px}
.gauge .bar span{display:block; height:100%}
.gauge .mk{position:absolute; top:-24px; transform:translateX(-50%); font-size:13px; font-weight:700; white-space:nowrap; background:var(--ink); color:var(--bg); padding:1px 8px; border-radius:8px}
.gauge .mk::after{content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--ink)}
.gauge .ticks{position:relative; height:16px; font-size:11px; color:var(--muted); margin-top:3px}
.gauge .ticks span{position:absolute; transform:translateX(-50%)}
.zone{display:grid; grid-template-columns:12px 1fr; gap:10px; padding:9px 10px; border-radius:10px; margin-top:4px}
.zone.on{background:var(--accent-soft)}

let simHM = "";
function now(){
  if(!simHM) return new Date();
  const p = parts(new Date(), "Asia/Seoul");
  let y=p.y, m=p.m, d=p.d;
  const base = new Date(Date.UTC(y, m-1, d));
  const wd = base.getUTCDay();
  if(wd===6) base.setUTCDate(base.getUTCDate()-1);
  if(wd===0) base.setUTCDate(base.getUTCDate()-2);
  const [hh, mm] = simHM.split(":").map(Number);
  // 06:30 같은 새벽 시간은 다음 날 새벽으로 본다 (미국장 끝나는 쪽)
  if(hh < 7 && simHM !== "") base.setUTCDate(base.getUTCDate()+1);
  return new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate(), hh-9, mm));
}
function parts(date, tz){
  const f = new Intl.DateTimeFormat("en-US",{timeZone:tz, hour12:false, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", weekday:"short"});
  const o = {}; f.formatToParts(date).forEach(x=>o[x.type]=x.value);
  const wdMap = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {y:+o.year, m:+o.month, d:+o.day, h:(+o.hour)%24, mi:+o.minute, wd:wdMap[o.weekday]};
}

function calc(e){
  const rows = e.h.map(([t,w])=>{ const s=STOCKS[t]; return {t, name:s[0], price:s[1], r:s[2], w, c:w*s[2]}; });
  let usd = rows.reduce((a,x)=>a+x.c,0);
  let restC = 0;
  if(e.rest){ restC = e.rest.w * FUT[e.rest.fut]; usd += restC; }
  const fxR = FX.now/FX.base - 1;
  const total = (1+usd)*(1+fxR) - 1;
  const fxC = total - usd;
  const est = e.nav*(1+total);
  const coverage = rows.reduce((a,x)=>a+x.w,0) + (e.cash||0);
  const market = est*(1+e.prem);
  return {rows, usd, restC, fxC, total, est, coverage, market, fxR};
}

}

      <div><div class="chg num ${cls(c.total)}">${pct(c.total)}</div><div class="est num">예상 ${won(c.est)}</div></div>
    </button>`; }
function searchEtfs(qs){
  const s = qs.trim().toLowerCase().replace(/\s+/g,"");
  const out = [];
  for(const e of ETFS){
    const nm = e.name.toLowerCase().replace(/\s+/g,"");
    if(nm.includes(s) || e.code.toLowerCase().includes(s) || e.groupName.toLowerCase().replace(/\s+/g,"").includes(s)){ out.push({e, hit:"", w:1}); continue; }
    const h = e.h.find(([t])=> sym(t).toLowerCase().replace(".","")===s.replace(".","") || STOCKS[t][0].toLowerCase().includes(s));
    if(h) out.push({e, hit:`${STOCKS[h[0]][0]} ${(h[1]*100).toFixed(1)}% 담고 있음`, w:h[1]});
  }
  // 이름으로 찾은 ETF 먼저, 회사로 찾은 ETF는 비중 큰 순
  return out.sort((a,b)=>b.w-a.w);
}

    ${mine.length ? mine.map(e=>etfCard(e)).join("") : `<p class="muted small">ETF 상세 화면에서 ☆를 누르면 여기에 모여요.</p>`}

}

function priceStateCard(e, c, st){
  const k = st.ks.key;
  let body;
  if(k==="closed"){
    const diff = c.est/e.close - 1;
    body = `<div class="state-line">오늘 종가 <span class="num">${won(e.close)}</span> → 지금 추정 가치 <span class="num">${won(c.est)}</span></div>
      <div class="small muted">추정 가치가 종가보다 <span class="num ${cls(diff)}">${Math.abs(diff*100).toFixed(2)}% ${diff>=0?"높아요":"낮아요"}</span>. 다음 정규장은 한국 시간 09:00에 열려요.</div>`;
  }else{
    const p = (c.market - c.est)/c.est;
    body = `<div class="state-line">시장가가 추정 가치보다 <span class="num ${cls(p)}">${Math.abs(p*100).toFixed(2)}% ${p>=0?"높게":"낮게"}</span> 거래 중</div>
      <div class="kv" style="margin-top:10px">
        <div><div class="k">현재가</div><div class="v num">${won(c.market)}</div></div>
        <div><div class="k">추정 가치</div><div class="v num">${won(c.est)}</div></div>
        <div><div class="k">지금 괴리율</div><div class="v num">${spct(p)}</div></div>
        <div><div class="k">최근 20일 평균</div><div class="v num">${spct(e.avgPrem)}</div></div>
      </div>`;
    const notes = {
      preauction:"지금은 장 시작 전 동시호가 시간이에요. LP 호가 제출 의무가 없는 시간이에요.",
      open5:"지금은 장 시작 후 5분 이내예요. LP 호가 제출 의무가 없는 시간이에요.",
      closeauction:"지금은 장 마감 동시호가 시간이에요. LP 호가 제출 의무가 없는 시간이에요."

    if(notes[k]) body += `<div class="callout">⏱ ${notes[k]}</div>`;
  }
  return `<section class="card"><h2>가격 상태 ${q("괴리율")}<span class="sub">${st.ks.label}</span></h2>${body}</section>`;
}

function trustCard(e, c){
  const errs = errHist(e.seed);
  const avg = errs.reduce((a,x)=>a+Math.abs(x),0)/errs.length;
  const W=300,H=56, bw=W/errs.length, mx=0.004;
  const bars = errs.map((v,i)=>{ const h=Math.min(Math.abs(v)/mx,1)*(H/2-4); const y = v>=0 ? H/2-h : H/2;
    return `<rect x="${(i*bw+2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="2" fill="var(--${i===errs.length-1?"accent":"muted"})" opacity="${i===errs.length-1?1:.45}"/>`; }).join("");
  return `<section class="card"><h2>이 추정을 얼마나 믿을 수 있나 ${q("추정 오차")}</h2>
    <div class="kv">
      <div><div class="k">시세 반영 비중 ${q("시세 반영 비중")}</div><div class="v num">${Math.round(c.coverage*100)}%${e.rest?` <span class="tiny muted">+ 선물 ${Math.round(e.rest.w*100)}%</span>`:""}</div></div>
      <div><div class="k">최근 20일 평균 오차</div><div class="v num">±${(avg*100).toFixed(2)}%</div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="최근 20거래일 추정 오차" style="margin-top:12px">
      <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)"/>${bars}</svg>
    <div class="tiny muted" style="display:flex;justify-content:space-between"><span>20거래일 전</span><span>어제 ${spct(errs[errs.length-1])}</span></div>
  </section>`;
}

function holdingsCard(e, c){
  const rows = [...c.rows];

  rows.sort((a,b)=>key(a)-key(b));

  extra += `<div class="row total"><div><div class="n">환율 효과</div><div class="t num">${FX.base} → ${FX.now}</div></div><div><div class="r1 num ${cls(c.fxC)}">${pctp(c.fxC)}</div></div></div>`;
  return `<section class="card"><h2>구성종목 ${q("기여도")}<span class="sub">총 ${total}종목 · 미국 시세 몇 분 단위 갱신</span></h2>
    <div class="seg" role="group" aria-label="정렬">
      <button type="button" data-sort="w" aria-pressed="${sortKey==="w"}">비중순</button>

  </section>`;
}

function compareCard(e, st){
  const same = ETFS.filter(x=>x.group===e.group);
  if(same.length<2) return "";
  const list = same.map(x=>{ const c=calc(x); const p = st.ks.key==="closed" ? x.close/c.est-1 : x.prem; return {x,p}; }).sort((a,b)=>a.p-b.p);
  const lbl = st.ks.key==="closed" ? "종가 − 추정 가치" : "지금 괴리율";
  return `<section class="card"><h2>같은 지수 ETF 비교 ${q("괴리율")}<span class="sub">${e.groupName} · ${lbl} 낮은 순</span></h2>
    ${list.map(({x,p})=>`<button class="row" type="button" data-etf="${x.code}">
      <div><div class="n">${x.name}${x.code===e.code?' <span class="chip mine">지금 보는 ETF</span>':""}</div><div class="t">${x.code}</div></div>
      <div><div class="r1 num">${spct(p)}</div></div></button>`).join("")}
    <div class="note">같은 지수를 따라가도 시장가와 추정 가치의 차이는 ETF마다 달라요.</div>
  </section>`;
}

function exposureChips(t){
  return ETFS.filter(e=>e.h.some(([x])=>x===t)).map(e=>{ const w = e.h.find(([x])=>x===t)[1];
    return `<span class="chip${stars.includes(e.code)?" mine":""}">${e.name.replace(/^(TIGER|KODEX|ACE|SOL) /,"$1 ")} ${(w*100).toFixed(1)}%</span>`; }).join("");
}
function evRow(ev, withChips=true){
  const [y,m,d] = ev.d.split("-").map(Number);
  const wd = KDAY[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  if(ev.type==="dist") return `<div class="ev"><div class="d num">${m}/${d}<small>(${wd})</small></div><span class="logo" style="background:var(--accent)" aria-hidden="true">분배</span>
    <div><div>${ev.title}</div><div class="tiny muted num">${ev.when}</div></div></div>`;
  const kind = ev.type==="earn" ? "실적" : "발사";
  const done = ev.done ? ` <span class="chip">발표 완료</span>` : "";
  const sec = ev.type==="earn" ? ` · <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${ev.t}&type=8-K" target="_blank" rel="noopener">SEC 공시 원문 ›</a>` : "";
  return `<div class="ev"><div class="d num">${m}/${d}<small>(${wd})</small></div>${logo(ev.t)}
    <div><div><span class="evtype">${kind}</span>${ev.title}${done}</div><div class="tiny muted">${ev.when}${ev.done?sec:""}</div>
    ${withChips?`<div class="chips">${exposureChips(ev.t)}</div>`:""}</div></div>`;
}

function eventsCard(e){

function newsCard(e){

function distEvents(){

/* ===================== 아침 브리핑 ===================== */
function inBriefWindow(k){ return k.h>=6 && k.h<9; }
function myPositions(){
  const m = {};
  holdings.forEach((h,i)=>{ const e = ETFS.find(x=>x.code===h.code); if(!e) return; (m[h.code] = m[h.code]||{e, lots:[]}); m[h.code].lots.push({...h, i}); });
  return Object.values(m).map(p=>{
    const c = calc(p.e);
    const qty = p.lots.reduce((a,h)=>a+(h.qty||0),0);
    const priced = p.lots.filter(h=>h.qty && h.buy);
    const qtyBuy = priced.reduce((a,h)=>a+h.qty,0);
    const cost = priced.reduce((a,h)=>a+h.qty*h.buy,0);
    const avgBuy = qtyBuy ? cost/qtyBuy : null;
    const inavLots = priced.filter(h=>h.buyInav);
    const paid = inavLots.length ? inavLots.reduce((a,h)=>a+(h.buy-h.buyInav)*h.qty,0) : null;
    return {...p, c, qty, qtyBuy, avgBuy, cost, paid, vsClose:c.est/p.e.close-1,
      closeVal:p.e.close*qty, diff:(c.est-p.e.close)*qty,
      pnlClose: avgBuy!==null ? (p.e.close-avgBuy)*qtyBuy : null,
      pnlEst: avgBuy!==null ? (c.est-avgBuy)*qtyBuy : null};
  }).sort((a,b)=> (Math.abs(b.diff)-Math.abs(a.diff)) || (Math.abs(b.vsClose)-Math.abs(a.vsClose)));
}
function totals(pos){ const tClose = pos.reduce((a,p)=>a+p.closeVal,0), tDiff = pos.reduce((a,p)=>a+p.diff,0); return {tClose, tDiff}; }
function totalLine(pos, big){
  const T = totals(pos);
  if(T.tClose>0) return `<div class="total num ${cls(T.tDiff)}">${spct(T.tDiff/T.tClose)} <span style="font-size:${big?18:17}px">(${T.tDiff>=0?"+":"−"}${won(Math.abs(T.tDiff))})</span></div>`;
  return `<div class="small muted" style="margin:4px 0">수량을 넣으면 내 돈 기준으로 얼마 변했는지 보여드려요.</div>`;
}

function catStats(c){

function howtoHtml(){
  const e = ETFS.find(x=>x.code==="133690"); const c = calc(e);
  const ex1 = (c.est-166500)*10;
  const avg = (10*170000+10*160000)/20;
  const ex2 = (c.est-avg)*20;
  const box = rows => `<div style="border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surface-2)">${rows.map(r=>`<div style="display:flex;gap:10px;padding:3px 0"><span class="muted" style="min-width:70px">${r[0]}</span><b class="num">${r[1]}</b></div>`).join("")}</div>`;
  const pmt = s => s>=0?"+"+won(s):"−"+won(-s);
  return `<h3 id="sheetTitle">보유 종목은 이렇게 넣어요</h3>
    <div class="small muted">예시는 ${e.name}이에요. 수익금 숫자는 샘플 시세로 계산했어요.</div>

    <div class="bsection"><h4>① ETF만 추가하기</h4>
      <p>수량과 매수가를 비워두고 <b>ETF만 골라서</b> 추가하면 돼요. 아침 브리핑과 등락률(%)을 볼 수 있어요. 금액은 나오지 않아요.</p>
    </div>

    <div class="bsection"><h4>② 한 번에 산 경우</h4>
      <p>예: <b>10주를 166,500원에</b> 샀어요.</p>
      ${box([["ETF",e.name],["수량","10"],["매수가","166500"]])}
      <p class="small">→ 지금 추정 수익금 <b class="num ${cls(ex1)}">${pmt(ex1)}</b>처럼 보여줘요.</p>
    </div>

    <div class="bsection"><h4>③ 여러 번 나눠 산 경우 (물타기)</h4>
      <p>예: 처음에 <b>10주를 170,000원</b>, 떨어졌을 때 <b>10주를 160,000원</b>에 더 샀어요.</p>
      <p style="margin-top:14px"><b>방법 A. 평균단가로 한 번에 넣기 (추천)</b></p>
      <p class="small">증권사 앱 잔고 화면의 <b>평균단가(평단)</b>와 전체 수량을 그대로 넣으면 돼요. 가장 간단해요.</p>
      ${box([["ETF",e.name],["수량","20"],["매수가",String(avg)]])}
      <p style="margin-top:14px"><b>방법 B. 산 횟수만큼 따로 넣기</b></p>
      <p class="small">추가하기를 두 번 눌러서 한 줄씩 넣어요. 같은 ETF는 앱이 자동으로 합쳐서 <b>20주, 평균 ${won(avg)}</b>으로 계산해요.</p>
      ${box([["1번째","10주 · 170000"],["2번째","10주 · 160000"]])}
      <p class="small">회차마다 그때의 iNAV까지 넣으면, 회차별로 웃돈을 얼마 냈는지도 계산돼요.</p>
      <p class="small">→ 두 방법 모두 결과가 같아요. 지금 추정 수익금 <b class="num ${cls(ex2)}">${pmt(ex2)}</b></p>
    </div>

    <div class="bsection"><h4>④ 일부를 팔았을 때</h4>
      <p class="small">보유 내역에서 그 ETF 줄을 삭제하고, 증권사 앱에 나오는 <b>남은 수량과 평균단가</b>로 다시 추가해 주세요.</p>
    </div>

    <div class="bsection"><h4>⑤ 당시 iNAV는 뭔가요? (선택)</h4>
      <p class="small">살 때 그 ETF의 실시간 추정 가치예요. 증권사 앱의 ETF 현재가 화면에서 볼 수 있어요. 넣으면 "추정 가치보다 얼마 더 주고 샀는지(웃돈)"를 계산해 줘요. 모르면 비워두세요.</p>
    </div>
    <button class="btn" type="button" data-close style="margin-top:20px;width:100%">알겠어요</button>`;
}

function zoneOf(x, v){ const i = x.zones.findIndex(z=> v < z[0]); return i<0 ? x.zones.length-1 : i; }

function zoneGaugeHtml(v, x, val){

  return `<div class="gauge">
      <span class="mk num" style="left:${pos.toFixed(1)}%">지금 ${fmtVal(v,val)}</span>
      <div class="bar">${x.zones.map((z,i)=>`<span style="width:${(((edges[i+1]-edges[i])/span)*100).toFixed(2)}%;background:${ZONE_COLORS[i%ZONE_COLORS.length]};opacity:${i===cur?1:.45}"></span>`).join("")}</div>
      <div class="ticks num">${tickVals.map(t=>`<span style="left:${(((t-x.min)/span)*100).toFixed(1)}%">${t}</span>`).join("")}</div>
    </div>
    ${x.zones.map((z,i)=>{ const lo = i===0 ? null : x.zones[i-1][0], hi = z[0]===INF ? null : z[0];
      const u = v.unit; const range = lo===null ? `${hi}${u} 미만` : hi===null ? `${lo}${u} 이상` : `${lo}~${hi}${u}`;
      return `<div class="zone${i===cur?" on":""}"><span class="sw" style="background:${ZONE_COLORS[i%ZONE_COLORS.length]}"></span><div><b>${z[1]}</b><span class="zr num">${range}</span>${i===cur?' <span class="chip mine">지금</span>':""}<p>${z[2]}</p></div></div>`; }).join("")}

function isDstDate(ds){ const [y,m,d] = ds.split("-").map(Number); const r = dstRange(y); const md = m*100+d; return md >= r.start[0]*100+r.start[1] && md < r.end[0]*100+r.end[1]; }

    <img src="${url}" alt="아침 브리핑 공유 이미지" style="width:100%;border-radius:14px;margin-top:12px;border:1px solid var(--line)">
    <button class="btn" type="button" data-saveimg style="width:100%;margin-top:12px">이미지 저장</button>
    <div class="tiny muted" id="saveMsg" style="margin-top:6px">저장이 안 되면 이미지를 길게 눌러 저장할 수 있어요.</div>
    ${code?`<button class="btn ghost" type="button" data-brief="${code}" style="margin-top:12px">‹ 브리핑으로</button>`:""}`, true);
}
async function saveShare(){
  const msg = document.getElementById("saveMsg"); if(!shareBlob) return;
  const name = "밤낮ETF-아침브리핑.png";
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const d = await window.claude.use("downloads");
      if(d){ await d.save({filename:name, data:shareBlob}); if(msg) msg.textContent = "저장했어요."; return; }
    }
  }catch(err){ if(err && err.code==="declined"){ if(msg) msg.textContent = "저장을 취소했어요."; return; } }
  try{ const f = new File([shareBlob], name, {type:"image/png"}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){}
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(shareBlob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); if(msg) msg.textContent = "저장했어요."; return; }catch(e){}
  if(msg) msg.textContent = "여기서는 저장이 막혀 있어요. 이미지를 길게 눌러 저장해 주세요.";
}

/* ===================== 팝업 ===================== */
const overlay = document.getElementById("overlay"), sheet = document.getElementById("sheet");
let lastFocus = null;
function openSheet(html, big){ sheet.classList.toggle("big", !!big); if(!overlay.classList.contains("open")) lastFocus = document.activeElement; sheet.scrollTop = 0; sheet.innerHTML = `<button class="icon-btn close" type="button" data-close aria-label="닫기">✕</button>`+html; overlay.classList.add("open"); sheet.querySelector("[data-close]").focus(); }
function closeSheet(){ overlay.classList.remove("open"); if(lastFocus) lastFocus.focus(); }
overlay.addEventListener("click", ev=>{ if(ev.target===overlay || ev.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && overlay.classList.contains("open")) closeSheet(); });
function stockSheet(t, from){
  const s = STOCKS[t]; const evs = EVENTS.filter(v=>v.t===t);
  const sym = t==="BRKB"?"BRK.B":t; // eslint-disable-line no-shadow
  const co = CO[t];
  const about = co ? `
    <div class="callout" style="font-size:15px;background:var(--accent-soft)">${co.one}</div>
    <h4 style="margin:16px 0 6px">무슨 일을 하나</h4>
    <ul style="margin:0;padding-left:18px">${co.does.map(d=>{ const [h,...r]=d.split(": "); return `<li style="margin:4px 0">${r.length?`<b>${h}</b> — ${r.join(": ")}`:h}</li>`; }).join("")}</ul>
    <div class="kv" style="margin-top:12px;grid-template-columns:1fr">
      <div><div class="k">돈은 어디서 버나</div><div class="small">${co.money}</div></div>
      ${co.chain && co.chain!=="—" ? `<div><div class="k">업계에서의 위치</div><div class="small">${co.chain}</div></div>`:""}
    </div>
    ${co.rel.length?`<h4 style="margin:16px 0 6px">같이 알아두면 좋은 회사</h4><div class="chips">${co.rel.filter(r=>STOCKS[r]).map(r=>`<button class="chip" type="button" data-stock="${r}" style="border:0;cursor:pointer">${STOCKS[r][0]}</button>`).join("")}</div>`:""}
    <p class="tiny muted" style="margin-top:12px">설명은 공개 자료를 정리한 초안이에요. 정확한 내용은 <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${co.cik||t}&type=${co.form}" target="_blank" rel="noopener">연간 보고서(${co.form}) 원문 ›</a>에서 확인할 수 있어요.</p>` : "";
  const fromE = from ? ETFS.find(x=>x.code===from) : null;
  openSheet(`${fromE?`<button class="btn ghost" type="button" data-brief="${from}" style="margin-bottom:10px">‹ ${fromE.name} 브리핑으로</button>`:""}<div class="with-logo" style="margin-bottom:6px">${logo(t)}<div><h3 id="sheetTitle" style="margin:0">${s[0]} <span class="muted small">${sym}</span></h3>${co?`<div class="tiny muted">${co.cat} · ${co.tag}</div>`:""}</div></div>
    <div class="num" style="font-size:22px;font-weight:700"><span>${usd(s[1])}</span> <span class="${cls(s[2])}" style="font-size:15px">${spct(s[2])}</span> <span class="tiny muted" style="font-weight:400">샘플 시세</span></div>
    ${about}
    <h4 style="margin:16px 0 4px">이 종목을 담은 ETF</h4><div class="chips">${exposureChips(t)}</div>
    <h4 style="margin:16px 0 4px">일정</h4>${evs.length?evs.map(v=>evRow(v,false)).join(""):`<div class="small muted">예정된 일정이 없어요.</div>`}
    <h4 style="margin:16px 0 4px">뉴스</h4>
    <div class="news"><span class="tag">${sym}</span>[예시] ${s[0]} 관련 뉴스 제목<div class="tiny muted">출처 · 원문 링크</div></div>
    <div class="news"><span class="tag">${sym}</span>[예시] ${s[0]} 관련 두 번째 뉴스 제목<div class="tiny muted">출처 · 원문 링크</div></div>
    `);
}

/* ===================== 라우팅 ===================== */
function route(){ const h = (location.hash||"").replace("#",""); return h || "main"; }
function go(name){ if(location.hash !== "#"+name) location.hash = name; else render(); }
function render(){
  const st = renderTop();
  const r = route();
  let html;
  const inA = r==="macro" || r.startsWith("macro-");
  const inEtf = !(r==="main" || inA);
  document.querySelector(".tabs").hidden = !inEtf;
  document.getElementById("backMain").hidden = (r==="main");
  document.getElementById("clocks").hidden = (r==="main");
  document.getElementById("protoBanner").hidden = (r==="main");
  document.getElementById("previewBox").hidden = (r==="main");
  document.querySelector(".top").classList.toggle("bare", r==="main");
  document.getElementById("brandTitle").innerHTML = r==="main" ? "" : inA ? "매크로 <span>지표</span>" : "밤낮 <span>ETF</span>";
  if(r==="main") html = viewMain(st);
  else if(r==="macro") html = viewMacro(st);
  else if(r.startsWith("macro-")) html = viewMacroGroup(r.slice(6), st);
  else if(r.startsWith("etf-")) html = viewEtf(r.slice(4), st);
  else if(r==="calendar") html = viewCalendar();
  else if(r==="portfolio") html = viewPortfolio();
  else if(r==="news") html = viewNews();
  else if(r==="guide") html = viewGuide();
  else html = viewHome(st);
  document.getElementById("view").innerHTML = html;
  const tabKey = r.startsWith("etf-") ? "home" : r;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current", b.dataset.go===tabKey ? "page" : "false"));
  const hq = document.getElementById("homeQ");
  if(hq) hq.addEventListener("input", ev=>{
    homeQuery = ev.target.value;
    document.getElementById("homeList").innerHTML = homeListHtml(st);
    const box = hq.parentElement; let cb = box.querySelector("[data-clearq]");
    if(homeQuery && !cb){ box.insertAdjacentHTML("beforeend", `<button class="clear" type="button" data-clearq aria-label="검색어 지우기">✕</button>`); }
    if(!homeQuery && cb) cb.remove();
  });
  const f = document.getElementById("addForm");
  if(f) f.addEventListener("submit", ev=>{ ev.preventDefault();
    const code = document.getElementById("fCode").value;
    const qty = +document.getElementById("fQty").value || null, buy = +document.getElementById("fBuy").value || null, inav = +document.getElementById("fInav").value || null;
    const msg = document.getElementById("addMsg");
    if((buy || inav) && !qty){ msg.textContent = "매수가나 iNAV를 넣으려면 수량도 같이 넣어주세요."; return; }
    if(exampleHoldings){ holdings = []; exampleHoldings = false; }
    if(!qty && holdings.some(h=>h.code===code)){ msg.textContent = "이미 추가된 ETF예요."; return; }
    holdings.push({code, qty, buy, buyInav: inav});
    store.set("holdings", holdings); render(); });
}
window.addEventListener("hashchange", ()=>{ showAll=false; render(); window.scrollTo(0,0); });

document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-go],[data-etf],[data-star],[data-sort],[data-toggle-all],[data-stock],[data-term],[data-cal],[data-del],[data-clearq],[data-copy],[data-import],[data-tipok],[data-brief],[data-news],[data-howto],[data-holi],[data-ind],[data-share],[data-saveimg],[data-lh],[data-jump],[data-map],[data-mh],[data-cp]");
  if(!el || el.closest("#sheet [data-close]")) return;
  if(el.dataset.share!==undefined){ openShare(el.dataset.share || null); return; }
  if(el.dataset.saveimg!==undefined){ saveShare(); return; }
  if(el.dataset.cp){ chartP[el.dataset.ck] = el.dataset.cp; const b = document.getElementById("chartBox"); if(b) b.innerHTML = chartHtml(el.dataset.ck); return; }
  if(el.dataset.map){ go("macro-map-"+el.dataset.map); return; }
  if(el.dataset.mh){ mapH = el.dataset.mh; render(); return; }
  if(el.dataset.jump){ const t = document.getElementById(el.dataset.jump); if(t) t.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(el.dataset.lh){ const box = document.getElementById("lnk"); if(box) box.innerHTML = linksHtml(el.dataset.lk, el.dataset.lh); return; }
  if(el.dataset.ind){ indSheet(el.dataset.ind, el.dataset.from, el.dataset.prev); return; }
  if(el.dataset.holi){ holiSheet(el.dataset.holi); return; }
  if(el.dataset.howto!==undefined){ openSheet(howtoHtml(), true); return; }
  if(el.dataset.brief){ openBrief(el.dataset.brief); return; }
  if(el.dataset.news){ newsFilter = el.dataset.news; render(); return; }
  if(el.dataset.tipok!==undefined){ store.set("tipSeen", true); render(); return; }
  if(el.dataset.copy!==undefined){
    const ta = document.getElementById("bkOut"); const msg = document.getElementById("copyMsg");
    try{ navigator.clipboard.writeText(ta.value).then(()=>{ msg.textContent="복사했어요"; }, ()=>{ ta.select(); msg.textContent="복사가 막혀 있어요. 코드를 길게 눌러 직접 복사해 주세요"; }); }
    catch(e){ ta.select(); msg.textContent="복사가 막혀 있어요. 코드를 길게 눌러 직접 복사해 주세요"; }
    return;
  }
  if(el.dataset.import!==undefined){
    const msg = document.getElementById("impMsg");
    try{
      const arr = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("bkIn").value.trim()))));
      if(!Array.isArray(arr) || !arr.every(h=>h && ETFS.some(e=>e.code===h.code))) throw 0;
      holdings = arr.map(h=>({code:h.code, qty:h.qty?+h.qty:null, buy:h.buy?+h.buy:null, buyInav:h.buyInav?+h.buyInav:null}));
      exampleHoldings = false; store.set("holdings", holdings); render();
    }catch(e){ msg.textContent = "코드를 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여넣었는지 확인해 주세요."; }
    return;
  }
  if(el.dataset.clearq!==undefined){ homeQuery=""; render(); const i=document.getElementById("homeQ"); if(i) i.focus(); return; }
  if(el.dataset.term){ openSheet(`<h3 id="sheetTitle">${el.dataset.term}</h3><p>${GLOSS[el.dataset.term]||""}</p>`); return; }
  if(el.dataset.go){ go(el.dataset.go); if(overlay.classList.contains("open")) closeSheet(); return; }
  if(el.dataset.etf){ go("etf-"+el.dataset.etf); return; }
  if(el.dataset.star){ const c = el.dataset.star; stars = stars.includes(c) ? stars.filter(x=>x!==c) : [...stars,c]; store.set("stars",stars); render(); return; }
  if(el.dataset.sort){ sortKey = el.dataset.sort; render(); return; }
  if(el.dataset.toggleAll!==undefined){ showAll=!showAll; render(); return; }
  if(el.dataset.stock){ stockSheet(el.dataset.stock, el.dataset.from); return; }
  if(el.dataset.cal){ calFilter = el.dataset.cal; render(); return; }
  if(el.dataset.del!==undefined){ holdings.splice(+el.dataset.del,1); exampleHoldings=false; store.set("holdings",holdings); render(); return; }
});

document.getElementById("simSel").addEventListener("change", ev=>{ simHM = ev.target.value; render(); });
render();
setInterval(()=>{ if(!overlay.classList.contains("open")) renderTop(); }, 20000);
</script>
</body>
