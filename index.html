<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노몬 · Gnomon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2314191D%22/%3E%3Ctext x=%2232%22 y=%2245%22 text-anchor=%22middle%22 font-family=%22Helvetica, Arial, sans-serif%22 font-size=%2240%22 font-weight=%22800%22 fill=%22%23FFFFFF%22%3EG%3C/text%3E%3C/svg%3E">
<style>
/* 레이아웃: 휴대폰 폭 한 줄 카드 스택. 상단 고정 시계 → 탭 → 화면별 카드. 한국 시간에 따라 낮/밤 테마 전환 */
:root{
  --rk:#1D1D1F; --rks:#8E8E93; --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --line:#E5E5EA;
  --accent:#1D1D1F; --accent-soft:#F2F2F4; --up:#E0352B; --down:#1F6FE5; --warn:#B25E00;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --r:16px;
  --z0:#F3E4B8; --z1:#EDD38D; --z2:#E2BF5E; --z3:#D3A52A; --z4:#BE8E0F; --zop:.75; --chart:#A67C00; --pt:#9A7B3C;
}
body[data-mode="dark"]{
  --rk:#050505; --rks:#636366; --bg:#0B0B0C; --surface:#0B0B0C; --surface-2:#1C1C1E; --ink:#F5F5F7; --muted:#A1A1A6; --line:#2C2C2E;
  --accent:#F5F5F7; --accent-soft:#1C1C1E; --up:#FF5A4F; --down:#4C9BFF; --warn:#FFA94D;
  --z0:#3A3A40; --z1:#4B4B53; --z2:#5F5F69; --z3:#777781; --z4:#92929C; --zop:1; --chart:#F4D27A; --pt:#D8BD80; --zcur:#E9C35C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.55; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; transition:background .4s, color .4s}
body[data-mode="dark"]{color-scheme:dark} body[data-mode="light"]{color-scheme:light}
button,select,input{font:inherit; color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)} .pt{color:var(--pt); font-weight:700}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

.app{max-width:680px; margin:0 auto; padding:0 16px 40px}

/* 상단 고정 영역 */
.top{position:sticky; top:0; z-index:20; pointer-events:none}
.brand{display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:2; background:var(--bg); padding:12px 0 10px; pointer-events:auto; border-bottom:1px solid transparent; transition:border-color .2s}
.topx{position:relative; z-index:1; background:var(--bg); border-bottom:1px solid var(--line); pointer-events:auto; transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.top.compact .topx{transform:translateY(calc(-100% - 1px)); pointer-events:none}
.top.compact .brand{border-bottom-color:var(--line)}
.top.bare .topx{border-bottom:0}
@media (prefers-reduced-motion: reduce){ .topx{transition:none} }
.brand h1{font-size:18px; margin:0; letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.mode-btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:13px}
.clocks{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px}
.clock{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 12px; text-align:left; cursor:pointer; display:block; width:100%; min-width:0; overflow:hidden}
.clock .city,.clock .pill{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; width:fit-content}
.clock:hover{border-color:var(--accent)}
.cmore{font-size:11px; color:var(--accent); margin-left:2px}
.cleft{display:block; margin-top:3px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hnext{background:var(--accent-soft); border-radius:14px; padding:14px 16px; margin:12px 0 4px}
.hnext .d{font-size:24px; font-weight:700}
.hrow{display:grid; grid-template-columns:96px 1fr auto; gap:10px; padding:11px 0; border-top:1px solid var(--line); align-items:baseline}
.hrow .dd{font-weight:600}
.hrow .why{line-height:1.4}
.hrow .why small{display:block; color:var(--muted); font-size:13px}
.hmonth{font-size:13px; color:var(--muted); font-weight:600; margin:14px 0 2px}
.dst-bar{display:grid; grid-template-columns:repeat(12,1fr); gap:2px; margin-top:8px}
.dst-bar span{height:26px; border-radius:4px; background:var(--surface-2); position:relative; overflow:hidden}
.dst-bar span i{position:absolute; top:0; bottom:0; background:var(--accent); opacity:.85}
.dst-lbl{display:grid; grid-template-columns:repeat(12,1fr); gap:2px; font-size:11px; color:var(--muted); text-align:center; margin-top:2px}
.ttable{width:100%; border-collapse:collapse; margin-top:8px; font-size:15px}
.ttable th,.ttable td{padding:8px 6px; border-top:1px solid var(--line); text-align:left}
.ttable th{font-size:13px; color:var(--muted); font-weight:600}
.clock .city{font-size:12px; color:var(--muted)}
.clock .time{font-size:17px; font-weight:600}
.pill{display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.pill.live{background:var(--accent-soft); color:var(--accent)}
.tabs{display:flex; gap:4px; margin-top:10px; overflow-x:auto}
.tab{flex:1; min-width:max-content; border:0; background:none; padding:10px 8px; cursor:pointer; color:var(--muted); font-weight:500; border-bottom:2px solid transparent}
.tab[aria-current="page"]{color:var(--ink); border-bottom-color:var(--ink)}

.banner{margin:14px 0 0; padding:10px 12px; border-radius:12px; background:var(--surface-2); font-size:13px; color:var(--muted)}

section.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-top:12px}
.card h2{font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:6px; text-wrap:balance}
.card h2 .sub{margin-left:auto; font-weight:400; font-size:12px; color:var(--muted)}
.qbtn{border:1px solid var(--line); background:none; width:24px; height:24px; min-width:24px; flex:none; border-radius:50%; font-size:12px; line-height:1; cursor:pointer; color:var(--muted); padding:0}

/* 홈 */
.strip{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.tile .lbl{font-size:12px; color:var(--muted)} .tile .val{font-weight:600; font-size:16px}
.list-title{display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 0}
.list-title h3{margin:0; font-size:15px}
.etf-card{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-top:8px; cursor:pointer}
.etf-card:hover{border-color:var(--muted)}
.etf-card .nm{font-weight:600; line-height:1.35}
.etf-card .meta{font-size:12px; color:var(--muted)}
.etf-card .chg{font-size:22px; font-weight:700; text-align:right}
.etf-card .est{font-size:12px; text-align:right; color:var(--muted)}

/* 상세 */
.back{display:flex; align-items:center; gap:8px; margin-top:14px}
.icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; height:36px; min-width:36px; cursor:pointer; padding:0 10px}
.back .title{flex:1; min-width:0}
.back .title b{display:block; line-height:1.3}
.star[aria-pressed="true"]{color:var(--ink)}
.hero{text-align:center; padding:24px 16px 20px}
.hero .lbl{font-size:13px; color:var(--muted)}
.hero .big{font-size:52px; font-weight:700; line-height:1.1; margin:6px 0 6px; letter-spacing:-.02em}
.hero .price{font-size:17px; font-weight:600}
.hero .basis{font-size:12px; color:var(--muted); margin-top:4px}
.split{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px}
.split div{background:var(--surface-2); border-radius:10px; padding:8px; font-size:13px}
.split b{display:block; font-size:16px}
.note{font-size:12px; color:var(--muted); margin-top:10px}
.state-line{font-size:16px; font-weight:600}
.callout{margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--surface-2); font-size:13px}
.kv{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.kv div{background:var(--surface-2); border-radius:10px; padding:8px 10px}
.kv .k{font-size:12px; color:var(--muted)} .kv .v{font-weight:600}

.seg{display:flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px; margin-bottom:8px}
.seg button{flex:1; border:0; background:none; border-radius:8px; padding:6px 4px; cursor:pointer; font-size:13px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 0 0 1px var(--line)}

.row{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:10px 2px; border-top:1px solid var(--line); width:100%; background:none; border-left:0; border-right:0; border-bottom:0; text-align:left; cursor:pointer}
.row:first-of-type{border-top:0}
.row .n{font-weight:500} .row .t{font-size:13px; color:var(--muted)}
.row .r1{text-align:right; font-weight:600} .row .r2{text-align:right; font-size:12px; color:var(--muted)}
.row.total{cursor:default; font-weight:600}
.wbar{height:3px; border-radius:2px; background:var(--accent); opacity:.45; margin-top:4px}
.more{display:block; width:100%; margin-top:8px; padding:10px; border:1px dashed var(--line); background:none; border-radius:10px; cursor:pointer; color:var(--muted)}

.logo{width:34px; height:34px; border-radius:50%; display:inline-grid; place-items:center; font-size:10px; font-weight:700; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); letter-spacing:-.02em; flex:none}
.logo.sm{width:28px; height:28px; font-size:9px}
.logo{position:relative; overflow:hidden}
.logo img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff; padding:3px; box-sizing:border-box}
.evtype{font-size:11px; font-weight:600; padding:1px 6px; border-radius:6px; background:var(--surface-2); color:var(--muted); margin-right:4px}
.with-logo{display:flex; align-items:center; gap:10px; min-width:0}
.search{position:relative; margin-top:14px}
.search input{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 40px 12px 14px; font-size:15px}
.search .clear{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:none; cursor:pointer; color:var(--muted); font-size:16px; padding:4px 8px}
details.cat{border-top:1px solid var(--line)} details.cat:first-child{border-top:0}
details.cat summary::-webkit-details-marker{display:none}
details.cat[open] summary b::after{content:" ▴"; color:var(--muted); font-weight:400}
details.cat:not([open]) summary b::after{content:" ▾"; color:var(--muted); font-weight:400}
.hit{font-size:12px; color:var(--accent); margin-top:2px}
.ev{display:grid; grid-template-columns:48px 34px 1fr; gap:10px; align-items:start; padding:10px 0; border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}

/* 제품 */
.art{width:100%; height:auto; display:block; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.art .a{stroke:var(--pt)} .art .f{fill:currentColor; stroke:none}
.art .af{fill:var(--pt); stroke:none} .art .t{stroke-width:.9} .art .k{fill:var(--rk); stroke-width:1} .art .s{stroke:var(--rks); stroke-width:.8} .art .d{stroke:var(--muted); stroke-width:.8}
.art text{fill:currentColor; stroke:none; font-size:11px; font-weight:600; font-family:inherit} .art text.m{fill:var(--muted); font-weight:400; font-size:9.5px}
.pfig.tall{padding:16px 6px 10px} .pfig.tall .art{max-width:320px; stroke-width:1.2} .pfig.tall .ptag{left:auto; right:12px}
.pcat{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.pcat::-webkit-scrollbar{display:none}
.pc{flex:none; border:1px solid var(--line); background:none; color:var(--muted); border-radius:999px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; min-height:32px}
.pc.on{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
.pgroup{margin-top:10px}
.pitem{border-top:1px solid var(--line)} .pitem:first-child{border-top:0}
.phead{display:grid; grid-template-columns:64px 1fr 14px; gap:12px; align-items:center; width:100%; padding:12px 0; background:none; border:0; text-align:left; font:inherit; color:var(--ink); cursor:pointer}
.pthumb{background:var(--surface-2); border-radius:12px; padding:6px; color:var(--ink)}
.ptext b{display:block; font-size:15px} .ptext small{display:block; font-size:12px; color:var(--muted); margin-top:1px} .pone{display:block; font-size:13px; color:var(--muted); margin-top:4px; line-height:1.45}
.pchev{color:var(--muted); font-size:18px; transition:transform .2s} .pitem.open .pchev{transform:rotate(90deg)}
.pbody{padding:0 0 16px}
.pfig{position:relative; background:var(--surface-2); border-radius:16px; padding:18px 28px; color:var(--ink)}
.pfig .art{max-width:240px; margin:0 auto; stroke-width:1.2}
.ptag{position:absolute; left:12px; top:12px; font-size:11px; font-weight:600; color:var(--pt); background:var(--bg); padding:3px 8px; border-radius:999px}
.pspecs{margin-top:10px} .pspecs>div{display:flex; justify-content:space-between; gap:14px; padding:8px 2px; border-bottom:1px solid var(--line); font-size:13px}
.pspecs span{color:var(--muted); flex:none} .pspecs b{font-weight:600; text-align:right; overflow-wrap:anywhere}
.pspecs>.psx{display:block; padding:0}
.psxbtn{display:flex; justify-content:space-between; align-items:center; gap:14px; width:100%; padding:8px 2px; min-height:36px; background:none; border:0; font:inherit; font-size:13px; color:var(--ink); text-align:left; cursor:pointer}
.psxbtn span{color:var(--muted); flex:none} .psxbtn b{font-weight:600; text-align:right; display:inline-flex; align-items:center; gap:6px}
.psx .tri{width:9px; height:6px; fill:var(--pt); flex:none; transition:transform .2s}
.psx.open .tri{transform:rotate(180deg)}
.psxlist{padding:2px 0 10px; animation:psxIn .22s ease}
.psxlist>div{display:flex; flex-direction:column; gap:1px; padding:8px 12px; margin-top:6px; border-radius:10px; background:var(--surface-2); font-size:13px}
.psxlist b{font-weight:600; text-align:left} .psxlist span{color:var(--muted); font-size:12px; text-align:left}
.psxlist em{font-style:normal; font-size:10px; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:0 6px; margin-left:4px; vertical-align:2px}
.psxlist p{margin:8px 2px 0}
/* 돈은 어디서 버나 · 업계에서의 위치 (눌러서 펼치기) */
:root{--d2:#1D1D1F; --d3:#8E8E93; --d4:#AEAEB2; --d5:#C7C7CC; --d6:#E5E5EA}
body[data-mode="dark"]{--d2:#F5F5F7; --d3:#8E8E93; --d4:#636366; --d5:#48484A; --d6:#3A3A3C}
.accs{margin-top:14px; border-top:1px solid var(--line)}
.acc{border-bottom:1px solid var(--line)}
.accbtn{display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:10px 2px; background:none; border:0; font:inherit; color:var(--ink); text-align:left; cursor:pointer}
.accbtn>b{font-size:15px; font-weight:700; flex:none}
.accbtn>span{flex:1; min-width:0; text-align:right; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.accbtn>span em{font-style:normal; color:var(--pt); font-weight:700}
.acc .tri{width:9px; height:6px; fill:var(--pt); flex:none; transition:transform .2s}
.acc.open .tri{transform:rotate(180deg)}
.accbody{padding:4px 0 14px; animation:psxIn .22s ease}
.donut{display:flex; align-items:center; gap:16px}
.donut .ring{position:relative; width:124px; height:124px; flex:none}
.donut .ring svg{width:100%; height:100%; display:block}
.donut .ring circle{fill:none; stroke-width:15}
.donut .ctr{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 24px}
.donut .ctr b{font-size:22px; font-weight:800; color:var(--pt); letter-spacing:-.5px; line-height:1.1}
.donut .ctr i{font-style:normal; font-size:11px; color:var(--muted); line-height:1.25; margin-top:2px; max-width:64px; word-break:break-all}
.leg{flex:1; min-width:0; display:grid; gap:7px}
.leg>div{display:grid; grid-template-columns:9px 1fr auto; column-gap:8px; align-items:baseline; font-size:13px}
.leg .dot{width:9px; height:9px; border-radius:3px; align-self:center}
.leg .nm{min-width:0; font-weight:600; word-break:keep-all}
.leg .nm small{display:block; font-weight:400; font-size:11px; color:var(--muted); margin-top:1px}
.leg .lv{font-weight:700; font-variant-numeric:tabular-nums; text-align:right}
.leg .lv small{display:block; font-weight:400; font-size:11px; color:var(--muted)}
.leg>div:first-child .lv{color:var(--pt)}
.mnote{margin:12px 0 0; font-size:13px; line-height:1.5}
.msrc{display:flex; flex-wrap:wrap; align-items:center; gap:0 10px; margin-top:6px} .msrc a{display:inline-flex; align-items:center; min-height:28px}
.vchain{display:grid; grid-template-columns:minmax(0,1fr) 12px auto 12px minmax(0,1fr); align-items:center; gap:0 4px}
.vchain .colh{font-size:11px; color:var(--muted); font-weight:600; margin-bottom:6px; text-align:center}
.vchain .col{display:grid; gap:6px; align-content:center}
.vchain .it{display:block; width:100%; padding:7px 8px; border-radius:10px; background:var(--surface-2); border:0; font:inherit; text-align:left; color:var(--ink)}
.vchain .it b{display:block; font-size:12.5px; font-weight:600; line-height:1.25; word-break:keep-all}
.vchain .it small{display:block; font-size:10.5px; color:var(--muted); line-height:1.3; margin-top:1px; word-break:keep-all}
.vchain button.it{cursor:pointer}
.vchain button.it b{text-decoration:underline; text-decoration-color:var(--pt); text-decoration-thickness:1.5px; text-underline-offset:3px}
.vchain .ar{color:var(--pt); font-size:13px; text-align:center}
.vchain .me{background:var(--ink); color:var(--bg); border-radius:12px; padding:10px 8px; text-align:center; max-width:96px}
.vchain .me b{display:block; font-size:13px; font-weight:800; line-height:1.2; overflow-wrap:anywhere}
.vchain .me small{display:block; font-size:10.5px; color:var(--pt); margin-top:4px; line-height:1.3; word-break:keep-all; font-weight:600}
body[data-mode="dark"] .vchain .me small{color:#8A6A2C}
@keyframes psxIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
.mstage{position:relative; aspect-ratio:3/2; background:var(--surface-2); border-radius:16px; overflow:hidden; cursor:pointer; color:var(--ink)}
.mfr{position:absolute; inset:0; width:100%; height:100%; opacity:0; transform:scale(1.05); transition:opacity .55s ease, transform 2.6s ease-out; stroke-width:1.4}
.mfr.on{opacity:1; transform:scale(1)}
.mbars{position:absolute; top:10px; left:12px; right:12px; display:flex; gap:4px; z-index:2}
.mbars i{flex:1; height:3px; border-radius:2px; background:color-mix(in srgb, var(--ink) 14%, transparent); overflow:hidden}
.mbars b{display:block; height:100%; width:0; background:var(--pt)}
.mbars i.done b{width:100%} .mbars i.cur b{animation:mbar 2.6s linear forwards}
@keyframes mbar{to{width:100%}}
.mtag{position:absolute; top:22px; left:12px; z-index:2; font-size:11px; font-weight:600; color:var(--muted); background:var(--bg); padding:3px 9px; border-radius:999px}
.mplay{position:absolute; left:10px; bottom:10px; z-index:2; border:0; border-radius:999px; padding:6px 12px; min-height:32px; font:inherit; font-size:12px; font-weight:600; background:var(--ink); color:var(--bg); cursor:pointer}

.trio .k{font-size:13px; color:var(--muted)} .trio .hit{background:none; box-shadow:inset 0 0 0 1.5px var(--ink)} .trio .hit .k{color:var(--ink); font-weight:600} .trio .v.sub{color:var(--muted); font-weight:600} .trio .v{font-size:19px; font-weight:700; white-space:nowrap; letter-spacing:-.02em}
.react{display:grid; grid-template-columns:1fr auto; gap:6px 12px; font-size:15px}
.react div:nth-child(even){text-align:right; font-weight:600}
/* 지표 게이지 */
.gauge{position:relative; margin:26px 0 6px}
.gauge .bar{display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px}
.gauge .bar span{display:block; height:100%}
.gauge .mk{position:absolute; top:-24px; transform:translateX(-50%); font-size:13px; font-weight:700; white-space:nowrap; background:var(--ink); color:var(--bg); padding:1px 8px; border-radius:8px}
.gauge .mk::after{content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--ink)}
.gauge .ticks{position:relative; height:16px; font-size:11px; color:var(--muted); margin-top:3px}
.gauge .ticks span{position:absolute; transform:translateX(-50%)}
.zone{display:grid; grid-template-columns:12px 1fr; gap:10px; padding:9px 10px; border-radius:10px; margin-top:4px}
.zone.on{background:var(--accent-soft)}
.zone .sw{width:12px; height:12px; border-radius:3px; margin-top:6px}
body[data-mode="dark"] .gauge .bar span.cur, body[data-mode="dark"] .zone .sw.cur{background:var(--zcur)!important}
body[data-mode="dark"] .zc{background:transparent!important; border-color:var(--zcur)!important; color:var(--zcur)}
.zone b{font-size:15px} .zone .zr{font-size:13px; color:var(--muted); margin-left:6px} .zone p{margin:2px 0 0; font-size:14px; color:var(--muted)}
.zone.on p{color:var(--ink)}
.chain{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.chain span{background:var(--surface-2); border-radius:10px; padding:6px 10px; font-size:14px}
.chain span.me{background:var(--accent-soft); color:var(--accent); font-weight:600}
.chain i{color:var(--muted); font-style:normal}
.oneline{font-size:18px; line-height:1.6; margin:14px 0 0}
/* 큰 브리핑 창 */
.sheet.big{height:86%; max-height:86%; font-size:17px; line-height:1.7; padding:22px 20px 48px}
.sheet.big h3{font-size:21px}
.bhead .big{font-size:46px; font-weight:700; line-height:1.1; letter-spacing:-.02em; margin:6px 0}
.bsection{margin-top:26px}
.bsection > h4{font-size:19px; margin:0 0 10px}
.bsection p{margin:0 0 10px}
.secbar{display:grid; grid-template-columns:110px 1fr 64px; gap:10px; align-items:center; margin:6px 0; font-size:15px}
.secbar .track{height:10px; background:var(--surface-2); border-radius:5px; position:relative; overflow:hidden}
.secbar .fill{position:absolute; top:0; bottom:0; border-radius:5px}
.co-block{padding:16px 0; border-top:1px solid var(--line)}
.co-block .top{display:flex; align-items:center; gap:10px}
.co-block .name{font-size:18px; font-weight:700}
.co-block .pct{margin-left:auto; font-size:21px; font-weight:700}
.co-block .one{color:var(--muted); margin:6px 0 2px; font-size:16px}
.co-block .meta{font-size:14px; color:var(--muted)}
.newsbox{background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-top:8px; font-size:15px; line-height:1.55}
.newsbox .src{font-size:13px; color:var(--muted)}
.colink{border:0; background:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:4px; text-decoration-color:var(--pt)}
.colink:hover{color:var(--pt)}
.linkbtn{border:0; background:none; color:var(--accent); cursor:pointer; padding:6px 0; font-size:15px}
/* 내 계좌 브리핑 카드 */
.bcard{display:block; width:100%; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-top:10px}
.bcard:hover{border-color:var(--accent)}
.bcard .t1{display:flex; align-items:baseline; gap:10px}
.bcard .nm{font-size:18px; font-weight:700; line-height:1.35}
.bcard .pc{margin-left:auto; font-size:26px; font-weight:700; white-space:nowrap}
.bcard .l2{font-size:15px; margin-top:6px}
.bcard .go{margin-top:10px; font-size:15px; color:var(--accent); font-weight:600}

/* 포트폴리오 */
.form{display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px}
.form label{font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px}
.form .full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:8px 10px; width:100%}
.btn{border:0; background:var(--ink); color:var(--bg); border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:600}
.btn.ghost{background:none; color:var(--muted); border:1px solid var(--line); padding:4px 10px; font-weight:400; font-size:12px}
.sum{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sum div{background:var(--surface-2); border-radius:10px; padding:10px 12px}
.sum b{display:block; font-size:18px}

/* 용어 */
dl.gl dt{font-weight:600; margin-top:14px} dl.gl dd{margin:2px 0 0; color:var(--muted); font-size:14px}

/* 팝업 */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; z-index:50}
.overlay.open{display:flex}
.sheet{background:var(--surface); width:100%; max-width:680px; max-height:85%; overflow:auto; border-radius:18px 18px 0 0; padding:18px 18px 28px}
.sheet h3{margin:0 0 6px; font-size:17px}
.sheet .close{float:right}

footer{margin-top:24px; font-size:12px; color:var(--muted)}
footer .preview{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px}
footer select{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:4px 8px; font-size:12px}

@media (max-width:420px){

  .tile .val{font-size:14px}
  .hero .big{font-size:44px}
  .form{grid-template-columns:1fr 1fr}
}
</style>

  FUT.es = usMove("SPY"); FUT.nq = usMove("QQQ"); FUT.sox = usMove("SOXQ"); FUT.semi = usMove("SMH"); FUT.div = usMove("SCHD");

    if(e.rest){
      const R = usMove(e.proxy); e.proxyR = R;
      const hv = (HOLD.etfs||{})[e.code];
      e.h = (hv ? hv.top : []).filter(x=>x.ticker && okn(STOCKS[TK(x.ticker)]?.[2])).map(x=>[TK(x.ticker), x.weight/100]);
      const sw = e.h.reduce((a,[,w])=>a+w,0), sc = e.h.reduce((a,[t,w])=>a+w*STOCKS[t][2],0);
      e.rest.w = Math.max(0, 1-sw); e.rest.n = Math.max(0, (e.nTotal||0) - e.h.length);
      e.rest.r = e.rest.w>0 ? (R - sc)/e.rest.w : 0;
    }else{
      // 비중형: 시세를 못 받은 종목은 받은 종목들의 평균 움직임으로 채워요

      const ok = all.filter(x=>okn(STOCKS[TK(x.ticker)]?.[2])), miss = all.filter(x=>!ok.includes(x));
      e.h = ok.map(x=>[TK(x.ticker), x.weight/100]);
      const sw = e.h.reduce((a,[,w])=>a+w,0), sc = e.h.reduce((a,[t,w])=>a+w*STOCKS[t][2],0);
      const mw = miss.reduce((a,x)=>a+x.weight/100,0);
      e.rest = mw>0 && sw>0 ? {w:mw, n:miss.length, fut:"", r:sc/sw} : null;
      e.proxy = e.rest ? "시세를 받은 종목 평균" : ""; e.proxyR = sw>0 ? sc/sw : NaN; e.missNames = miss.map(x=>x.ko||x.name);
    }
    // 기준가: 한국 마지막 장 날짜 것이 있으면 그대로, 없으면 이전 기준가에서 미국 종가·환율 변화로 이어 붙여요
    const rows = (LIVE.kr||{})[e.code] || [];
    const hit = rows.find(r=>r.d===kr);
    e.prem = NaN;
    const pr = rows.filter(r=>r.nav>0 && r.close>0).map(r=>r.close/r.nav-1);
    e.avgPrem = pr.length ? pr.reduce((a,x)=>a+x,0)/pr.length : NaN;
    if(hit){ e.nav = hit.nav; e.close = hit.close; e.navNote = `${mdTxt(kr)} 기준가`; e.navReal = true; continue; }
    const prev = rows.filter(r=>r.d<kr).pop();
    e.close = NaN; e.navReal = false;
    if(!prev){ e.nav = NaN; e.navNote = "기준가 확인 중"; continue; }
    const u0 = prevUs(prev.d), fx0 = fxAt(prev.d)[1];
    const legs = e.kind!=="pdf" ? [[e.proxy,1]] : e.h.map(([t,w])=>[t==="BRKB"?"BRK-B":t,w]);
    let f = e.cash||0; for(const [t,w] of legs){ f += w * (usClose(t, LV.U)/usClose(t, u0)); }
    if(e.kind==="pdf" && e.rest) f += e.rest.w * (1 + e.rest.r);
    e.nav = prev.nav * f * (br/fx0);
    e.navNote = okn(e.nav) ? `${mdTxt(kr)} 기준가 추정 · ${mdTxt(prev.d)} 공시 기준가에서 이어 계산` : "기준가 확인 중";
  }

}

function calc(e){
  const rows = e.h.map(([t,w])=>{ const s = STOCKS[t] || [t, NaN, NaN]; const bad = FLAG.stock.has(t);
    const r = bad ? NaN : s[2]; return {t, name:s[0], price: bad ? NaN : s[1], r, w, c:w*r}; });
  let usd = rows.reduce((a,x)=>a+x.c,0);
  let restC = 0;
  if(e.rest){ restC = e.rest.w * (okn(e.rest.r) ? e.rest.r : FUT[e.rest.fut]); usd += restC; }
  let fxR = FX.now/FX.base - 1; if(Math.abs(fxR) < 1e-9) fxR = 0;
  const total = fxR===0 ? usd : (1+usd)*(1+fxR) - 1;
  const fxC = total - usd;
  const est = e.nav*(1+total);
  const coverage = rows.reduce((a,x)=>a+x.w,0) + (e.cash||0);
  const market = est*(1+e.prem);
  if(FLAG.etf.has(e.code)) return {rows, usd:NaN, restC, fxC:NaN, total:NaN, est:NaN, coverage, market:NaN, fxR};
  return {rows, usd, restC, fxC, total, est, coverage, market, fxR};
}

function realErrs(e){

  for(let i=1;i<rows.length;i++){ const r0 = rows[i-1], r1 = rows[i];
    const u0 = prevUs(r0.d), u1 = prevUs(r1.d), f0 = fxAt(r0.d)[1], f1 = fxAt(r1.d)[1];
    if(e.kind==="pdf" && e.rest) continue;  // 시세 없는 종목이 있으면 과거 오차는 계산하지 않아요
    const legs = e.kind!=="pdf" ? [[e.proxy,1]] : e.h.map(([t,w])=>[t==="BRKB"?"BRK-B":t,w]);
    let f = e.cash||0; for(const [t,w] of legs) f += w * (usClose(t,u1)/usClose(t,u0));
    const pred = r0.nav * f * (f1/f0);
    if(okn(pred)) out.push({d:r1.d, v:pred/r1.nav - 1});
  }
  return out.slice(-20);
}

      ${homeQuery?`<button class="clear" type="button" data-clearq aria-label="검색어 지우기">✕</button>`:""}

      <div class="tile"><div class="lbl">나스닥100 <span class="tiny muted">QQQ</span></div><div class="val num ${cls(FUT.nq)}">${pct(FUT.nq)}</div></div>
      <div class="tile"><div class="lbl">S&amp;P500 <span class="tiny muted">SPY</span></div><div class="val num ${cls(FUT.es)}">${pct(FUT.es)}</div></div>
      <div class="tile"><div class="lbl">원/달러</div><div class="val num">${okn(FX.now)?FX.now.toFixed(1):PEND}</div><div class="tiny num ${cls(FX.now/FX.base-1)}">${pct(FX.now/FX.base-1)}</div></div>
    </div>
    <p class="tiny muted stamp" style="margin:6px 4px 0">${dataStamp()} · 한국 장 마감 뒤 움직임이에요</p>
    <div id="homeList">${homeListHtml(st)}</div>`;
}

function priceStateCard(e, c, st){
  const k = st.ks.key;
  let body;
  if(k==="closed" && !okn(e.close)){
    body = `<div class="state-line">지금 추정 변화 <b class="num ${cls(c.total)}">${spct(c.total)}</b></div>
      <div class="small muted">${mdTxt(LV.kr)} 종가와 기준가가 공시되면 원화 가격도 함께 보여드려요. 다음 정규장은 한국 시간 09:00에 열려요.</div>`;
  }else if(k==="closed"){
    const diff = c.est/e.close - 1;
    body = `<div class="state-line">오늘 종가 <span class="num">${won(e.close)}</span> → 지금 추정 가치 <b class="num ${cls(diff)}" style="white-space:nowrap">${won(c.est)}</b></div>
      <div class="small muted">추정 가치가 종가보다 <span class="num ${cls(diff)}">${okn(diff) ? `${Math.abs(diff*100).toFixed(2)}% ${diff>=0?"높아요":"낮아요"}` : PEND}</span>. 다음 정규장은 한국 시간 09:00에 열려요.</div>`;
  }else{
    const p = (c.market - c.est)/c.est;
    body = `<div class="state-line">시장가가 추정 가치보다 <span class="num ${cls(p)}">${okn(p) ? `${Math.abs(p*100).toFixed(2)}% ${p>=0?"높게":"낮게"}` : PEND}</span> 거래 중</div>
      <div class="kv" style="margin-top:10px">
        <div><div class="k">현재가</div><div class="v num">${won(c.market)}</div></div>
        <div><div class="k">추정 가치</div><div class="v num">${won(c.est)}</div></div>
        <div><div class="k">지금 괴리율</div><div class="v num">${spct(p)}</div></div>
        <div><div class="k">최근 20일 평균</div><div class="v num">${spct(e.avgPrem)}</div></div>
      </div>`;
    const notes = {
      preauction:"지금은 장 시작 전 동시호가 시간이에요. LP 호가 제출 의무가 없는 시간이에요.",
      open5:"지금은 장 시작 후 5분 이내예요. LP 호가 제출 의무가 없는 시간이에요.",
      closeauction:"지금은 장 마감 동시호가 시간이에요. LP 호가 제출 의무가 없는 시간이에요."
    };
    if(notes[k]) body += `<div class="callout">⏱ ${notes[k]}</div>`;
  }
  return `<section class="card"><h2>가격 상태 ${q("괴리율")}<span class="sub">${st.ks.label}</span></h2>${body}</section>`;
}

function trustCard(e, c){
  const re = realErrs(e), real = re.length >= 3;
  const errs = real ? re.map(x=>x.v) : errHist(e.seed);
  const avg = errs.reduce((a,x)=>a+Math.abs(x),0)/errs.length;
  const W=300,H=56, bw=W/errs.length, mx=0.004;
  const bars = errs.map((v,i)=>{ const h=Math.min(Math.abs(v)/mx,1)*(H/2-4); const y = v>=0 ? H/2-h : H/2;
    return `<rect x="${(i*bw+2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="2" fill="var(--${i===errs.length-1?"accent":"muted"})" opacity="${i===errs.length-1?1:.45}"/>`; }).join("");
  return `<section class="card"><h2>이 추정을 얼마나 믿을 수 있나 ${q("추정 오차")}</h2>
    <div class="kv">
      <div><div class="k">시세 반영 비중 ${q("시세 반영 비중")}</div><div class="v num">${Math.round(c.coverage*100)}%${e.rest?` <span class="tiny muted">+ ${e.proxy} ${Math.round(e.rest.w*100)}%</span>`:""}</div></div>
      <div><div class="k">최근 ${real?errs.length:20}일 평균 오차 <span class="tiny muted">${real?"실제":"샘플 · 기록 쌓는 중"}</span></div><div class="v num">±${(avg*100).toFixed(2)}%</div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="최근 20거래일 추정 오차" style="margin-top:12px">
      <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--line)"/>${bars}</svg>
    <div class="tiny muted" style="display:flex;justify-content:space-between"><span>${real?errs.length:20}거래일 전</span><span>${real?mdTxt(re[re.length-1].d):"어제"} ${spct(errs[errs.length-1])}</span></div>
  </section>`;
}

function holdingsCard(e, c){
  const rows = [...c.rows];
  const key = {w:x=>-x.w, c:x=>-Math.abs(x.c), r:x=>-x.r}[sortKey];
  rows.sort((a,b)=>key(a)-key(b));
  const shown = showAll ? rows : rows.slice(0,5);
  const maxW = Math.max(...rows.map(x=>x.w));
  const total = e.h.length + (e.rest?e.rest.n:0);
  const row = x => `<button class="row" type="button" data-stock="${x.t}">
      <div class="with-logo">${logo(x.t,true)}<div style="flex:1;min-width:0"><div class="n">${x.name} <span class="t">${sym(x.t)}</span></div>
        <div class="t num">${CO[x.t]?CO[x.t].tag+" · ":""}비중 ${(x.w*100).toFixed(1)}% · ${usd(x.price)}</div>
        <div class="wbar" style="width:${(x.w/maxW*100).toFixed(0)}%"></div></div></div>
      <div><div class="r1 num ${cls(x.r)}">${spct(x.r)}</div><div class="r2 num">기여 ${pctp(x.c)}</div></div>
    </button>`;
  let extra = "";
  if(e.rest) extra += `<div class="row total"><div><div class="n">나머지 ${e.rest.n}종목</div><div class="t">비중 ${(e.rest.w*100).toFixed(1)}% · ${e.proxy} 움직임에 맞춤</div></div><div><div class="r2 num">기여 ${pctp(c.restC)}</div></div></div>`;
  extra += `<div class="row total"><div><div class="n">미국 주식 합계</div></div><div><div class="r1 num ${cls(c.usd)}">${pctp(c.usd)}</div></div></div>`;
  extra += `<div class="row total"><div><div class="n">환율 효과</div><div class="t num">${FX.base} → ${FX.now}</div></div><div><div class="r1 num ${cls(c.fxC)}">${pctp(c.fxC)}</div></div></div>`;
  return `<section class="card"><h2>구성종목 ${q("기여도")}<span class="sub">총 ${total}종목 · ${e.hsrc||"구성종목"}${e.hasof?` · ${String(e.hasof).replace(/^As of /,"")}`:""}</span></h2>
    <div class="seg" role="group" aria-label="정렬">
      <button type="button" data-sort="w" aria-pressed="${sortKey==="w"}">비중순</button>
      <button type="button" data-sort="c" aria-pressed="${sortKey==="c"}">기여도순</button>
      <button type="button" data-sort="r" aria-pressed="${sortKey==="r"}">등락순</button>
    </div>
    ${rows.length?"":`<p class="small muted" style="margin:8px 2px">이 ETF의 구성종목 비중은 아직 받아오지 못했어요. 지금 계산은 같은 지수를 따르는 미국 ETF ${e.proxy} 움직임으로 해요.</p>`}
    ${shown.map(row).join("")}
    ${rows.length>5 ? `<button class="more" type="button" data-toggle-all>${showAll?"접기":`${rows.length}개 전체 보기`}</button>` : ""}
    <div style="margin-top:10px">${extra}</div>
    <div class="note">종목을 누르면 그 회사가 하는 일, 일정, 뉴스를 볼 수 있어요.</div>
  </section>`;
}

function compositionCard(e, c){
  const groups = {};
  c.rows.forEach(x=>{ const k = CO[x.t]?CO[x.t].cat:"기타"; (groups[k] = groups[k]||{w:0, items:[]}); groups[k].w += x.w; groups[k].items.push(x); });
  const list = Object.entries(groups).sort((a,b)=>b[1].w-a[1].w).map(([k,v],i)=>({k, ...v, color:CAT_COLORS[i%CAT_COLORS.length]}));
  if(e.rest) list.push({k:`나머지 ${e.rest.n}종목`, w:e.rest.w, items:[], color:"var(--line)"});
  if(e.cash) list.push({k:"현금", w:e.cash, items:[], color:"var(--line)"});
  const bar = list.map(g=>`<span title="${g.k}" style="display:block;height:100%;width:${(g.w*100).toFixed(2)}%;background:${g.color}"></span>`).join("");
  return `<section class="card"><h2>담긴 회사들은 뭘 하나<span class="sub">비중 기준</span></h2>
    <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px" role="img" aria-label="분야별 비중">${bar}</div>
    <div style="margin-top:10px">${list.map(g=> g.items.length ? `
      <details class="cat"><summary style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;list-style:none">
        <span style="width:10px;height:10px;border-radius:3px;background:${g.color};flex:none"></span>
        <b style="font-weight:600">${g.k}</b><span class="num muted">${(g.w*100).toFixed(1)}%</span>
        <span class="tiny muted" style="margin-left:auto;text-align:right">${g.items.slice(0,3).map(x=>x.name).join(", ")}${g.items.length>3?` 외 ${g.items.length-3}`:""}</span></summary>
        ${g.items.sort((a,b)=>b.w-a.w).map(x=>`<button class="row" type="button" data-stock="${x.t}"><div class="with-logo">${logo(x.t,true)}<div><div class="n">${x.name}</div><div class="t">${CO[x.t]?CO[x.t].one:""}</div></div></div><div><div class="r2 num">${(x.w*100).toFixed(1)}%</div></div></button>`).join("")}
      </details>` : `<div style="display:flex;align-items:center;gap:8px;padding:8px 0"><span style="width:10px;height:10px;border-radius:3px;background:${g.color};flex:none"></span><span class="muted">${g.k}</span><span class="num muted">${(g.w*100).toFixed(1)}%</span></div>`).join("")}</div>
    <div class="note">분야를 누르면 회사별 한 줄 소개가 펼쳐져요.</div>
  </section>`;
}

function compareCard(e, st){
  const same = ETFS.filter(x=>x.group===e.group);
  if(same.length<2) return "";
  const list = same.map(x=>{ const c=calc(x); const p = st.ks.key==="closed" ? x.close/c.est-1 : x.prem; return {x,p}; }).sort((a,b)=>a.p-b.p);
  const lbl = st.ks.key==="closed" ? "종가 − 추정 가치" : "지금 괴리율";
  return `<section class="card"><h2>같은 지수 ETF 비교 ${q("괴리율")}<span class="sub">${e.groupName} · ${lbl} 낮은 순</span></h2>
    ${list.map(({x,p})=>`<button class="row" type="button" data-etf="${x.code}">
      <div><div class="n">${x.name}${x.code===e.code?' <span class="chip mine">지금 보는 ETF</span>':""}</div><div class="t">${x.code}</div></div>
      <div><div class="r1 num">${spct(p)}</div></div></button>`).join("")}
    <div class="note">같은 지수를 따라가도 시장가와 추정 가치의 차이는 ETF마다 달라요.</div>
  </section>`;
}

function exposureChips(t){
  return ETFS.filter(e=>e.h.some(([x])=>x===t)).map(e=>{ const w = e.h.find(([x])=>x===t)[1];
    return `<span class="chip${stars.includes(e.code)?" mine":""}">${e.name.replace(/^(TIGER|KODEX|ACE|SOL) /,"$1 ")} ${(w*100).toFixed(1)}%</span>`; }).join("");
}
function evRow(ev, withChips=true){
  const [y,m,d] = ev.d.split("-").map(Number);
  const wd = KDAY[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  const evid = ev.type==="dist" ? `dist:${ev.code}` : `${ev.t}:${ev.d}`;
  const open = `class="ev tap" role="button" tabindex="0" data-evt="${evid}" aria-label="${ev.title} 자세히 보기"`;
  if(ev.type==="dist") return `<div ${open}><div class="d num">${m}/${d}<small>(${wd})</small></div><span class="logo" style="background:var(--accent)" aria-hidden="true">분배</span>
    <div><div>${ev.title} <span class="evmore">›</span></div><div class="tiny muted num">${ev.when}</div></div></div>`;
  const kind = ev.type==="earn" ? "실적" : "발사";
  const done = (ev.done ? ` <span class="chip">${ev.type==="earn"?"발표 완료":"완료"}</span>` : "") + (ev.card && ev.card.real ? ` <span class="chip okchip">확인됨</span>` : "");
  const sec = ev.type==="earn" ? ` · <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${ev.t}&type=8-K" target="_blank" rel="noopener">SEC 공시 원문 ›</a>` : "";
  return `<div ${open}><div class="d num">${m}/${d}<small>(${wd})</small></div>${logo(ev.t)}
    <div><div><span class="evtype">${kind}</span>${ev.title}${done} <span class="evmore">›</span></div><div class="tiny muted">${ev.when}${ev.done?sec:""}</div>
    ${withChips?`<div class="chips">${exposureChips(ev.t)}</div>`:""}</div></div>`;
}

function etfImpactHtml(t, move){
  const rows = ETFS.filter(e=>e.h.some(([x])=>x===t)).map(e=>({e, w:e.h.find(([x])=>x===t)[1]})).sort((a,b)=>b.w-a.w).slice(0,4);
  if(!rows.length) return "";
  const name = STOCKS[t] ? STOCKS[t][0] : t;
  return `<div class="bsection"><h4>ETF 영향</h4>
    <p class="small" style="margin:0 0 8px">${josaIGa(name)} 하루에 <b class="num">${move}%</b> 움직이면, 다른 종목이 그대로일 때 ETF는 대략 이만큼 움직여요.</p>
    <div class="impact">${rows.map(r=>`<div><span>${r.e.name}<small class="num">비중 ${(r.w*100).toFixed(1)}%</small></span><b class="num">±${(r.w*move).toFixed(2)}%</b></div>`).join("")}</div>
    <p class="tiny muted" style="margin-top:6px">비중 × 움직임으로 계산한 대략적인 값이에요. 환율과 다른 종목 움직임은 빼고 계산했어요.</p></div>`;
}
function evTitleHtml(ev){
  const s = STOCKS[ev.t]; if(!s) return ev.title;
  const key = s[0].replace(/\s/g,""); let cut = -1;
  for(let i=1;i<=ev.title.length;i++){ if(ev.title.slice(0,i).replace(/\s/g,"")===key){ cut=i; break; } }
  const link = txt => `<button class="colink" type="button" data-stock="${ev.t}" data-fromev="${ev.t}:${ev.d}" aria-label="${s[0]} 회사 설명 보기">${txt}</button>`;
  return cut>0 ? link(ev.title.slice(0,cut)) + ev.title.slice(cut) : `${ev.title} <span class="small">· ${link(s[0])}</span>`;
}
function eventCardSheet(ev){
  const C = ev.card, t = ev.t, co = CO[t] || {};
  const [y,m,dd] = ev.d.split("-").map(Number); const wd = KDAY[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
  const today = ymd(parts(now(),"Asia/Seoul")); const left = dayDiff(today, ev.d);
  const badge = ev.done ? `<span class="evbadge done">${ev.type==="earn"?"발표 완료":"완료"}</span>` : left===0 ? `<span class="evbadge">오늘</span>` : left>0 ? `<span class="evbadge">D-${left}</span>` : "";
  const fmtAsof = C.asof ? `${+C.asof.slice(5,7)}/${+C.asof.slice(8,10)}` : "";
  openSheet(`<h3 id="sheetTitle">${evTitleHtml(ev)} ${badge}</h3>
    <p class="small muted" style="margin-top:0">${m}/${dd}(${wd}) ${ev.when} · 한국 시간${ev.q?` · ${ev.q}`:""}</p>
    <p class="evsum">${C.sum}</p>
    <div class="evtiles">${C.tiles.map(([k,v,sub,cmp])=>`<div><div class="k">${k}</div><div class="v num${cmp?" "+cls(cmp[0]-cmp[1]):""}">${v}</div>${sub?`<div class="s num">${sub}</div>`:""}</div>`).join("")}</div>
    ${C.tiles.some(x=>x[3]) ? `<p class="tiny muted" style="margin:6px 2px 0">빨강은 예상보다 높게, 파랑은 낮게 나온 숫자예요.</p>` : ""}
    ${missionHtml(`${t}:${ev.d}`)}
    <div class="bsection"><h4>${ev.done ? "핵심 정리" : "관전 포인트"}</h4><ol class="evcheck">${C.check.map(c=>`<li>${c}</li>`).join("")}</ol></div>
    ${C.ifGood || C.ifBad ? `<div class="bsection"><h4>결과별 해석</h4><div class="evif">
      ${C.ifGood?`<div><b>예상보다 좋으면</b><span>${C.ifGood}</span></div>`:""}${C.ifBad?`<div><b>예상에 못 미치면</b><span>${C.ifBad}</span></div>`:""}</div>
      <p class="tiny muted" style="margin-top:6px">항상 그렇지는 않아요. 그날 시장 분위기와 다른 발표에 따라 반대로 움직이기도 해요.</p></div>` : ""}
    ${etfImpactHtml(t, ev.type==="earn" ? 5 : 3)}
    <details class="more"><summary>더 보기 <span>· 배경 분석${co.one?", 회사 개요":""}</span></summary>
      <div class="bsection">${C.detail.map(x=>`<p>${x}</p>`).join("")}</div>
      ${co.one ? `<div class="bsection"><h4>회사 개요</h4><p>${co.one}</p></div>` : ""}
    </details>
    <div class="evsrc"><span class="tiny muted">출처 · ${fmtAsof} 기준</span>${C.src.map(([n,u])=>`<a class="tiny" href="${u}" target="_blank" rel="noopener">${n} ›</a>`).join("")}</div>
    <p class="tiny muted" style="margin-top:10px">정보 제공용이며 투자 권유가 아니에요.</p>`, true);
  missionStart();
}

function inBriefWindow(k){ return k.h>=6 && k.h<9; }
function myPositions(){
  const m = {};
  holdings.forEach((h,i)=>{ const e = ETFS.find(x=>x.code===h.code); if(!e) return; (m[h.code] = m[h.code]||{e, lots:[]}); m[h.code].lots.push({...h, i}); });
  return Object.values(m).map(p=>{
    const c = calc(p.e);
    const qty = p.lots.reduce((a,h)=>a+(h.qty||0),0);
    const priced = p.lots.filter(h=>h.qty && h.buy);
    const qtyBuy = priced.reduce((a,h)=>a+h.qty,0);
    const cost = priced.reduce((a,h)=>a+h.qty*h.buy,0);
    const avgBuy = qtyBuy ? cost/qtyBuy : null;
    const inavLots = priced.filter(h=>h.buyInav);
    const paid = inavLots.length ? inavLots.reduce((a,h)=>a+(h.buy-h.buyInav)*h.qty,0) : null;
    return {...p, c, qty, qtyBuy, avgBuy, cost, paid, vsClose:c.est/p.e.close-1,
      closeVal:p.e.close*qty, diff:(c.est-p.e.close)*qty,
      pnlClose: avgBuy!==null ? (p.e.close-avgBuy)*qtyBuy : null,
      pnlEst: avgBuy!==null ? (c.est-avgBuy)*qtyBuy : null};
  }).sort((a,b)=> (Math.abs(b.diff)-Math.abs(a.diff)) || (Math.abs(b.vsClose)-Math.abs(a.vsClose)));
}

function catStats(c){
  const g = {};
  c.rows.forEach(x=>{ const k = CO[x.t]?CO[x.t].cat:"기타"; (g[k]=g[k]||{w:0,c:0}); g[k].w+=x.w; g[k].c+=x.c; });
  return Object.entries(g).map(([k,v])=>({k, w:v.w, r:v.c/v.w})).sort((a,b)=>b.r-a.r);
}
function etfBriefHtml(code){
  const st = renderTop();

  const up = c.rows.filter(x=>x.r>0).length, down = c.rows.filter(x=>x.r<0).length;
  const cats = catStats(c);
  const maxAbs = Math.max(...cats.map(x=>Math.abs(x.r)), .001);
  const futName = e.rest ? (e.kind==="pdf" ? "시세를 받은 종목들" : `${e.proxy}(같은 지수를 따르는 미국 ETF)`) : "";

  const lead = sorted.filter((x,i)=> Math.abs(x.r)>=BIG || i<4);
  const others = sorted.filter(x=>!lead.includes(x));
  const evs = EVENTS.filter(v=>e.h.some(([t])=>t===v.t) && v.d>=ymd(k)).slice(0,3);
  const err = errHist(e.seed).slice(-1)[0];

  return `<div class="bhead">

      ${mine && mine.qty>0?`<div>내 ${mine.qty}주 기준 <b class="num ${cls(mine.diff)}">${mine.diff>=0?"+":"−"}${won(Math.abs(mine.diff))}</b></div>`:""}

    </div>

    <div class="bsection"><h4>① 밤사이 ${gi.title}</h4>
      <p>${gi.idx}에 담긴 회사들은 달러 기준으로 <b class="num ${cls(c.usd)}">${spct(c.usd)}</b> 움직였어요.${e.rest?` 지수 전체를 따르는 ${futName}의 움직임은 <b class="num ${cls(e.proxyR)}">${spct(e.proxyR)}</b>였어요.`:""}</p>
      <p>개별로 계산한 ${c.rows.length}개 회사 중 <b class="up">${up}개가 오르고</b> <b class="down">${down}개가 내렸어요</b>.</p>
      ${cats.length>1?`<p>분야별로 보면 가장 강한 곳은 <b>${cats[0].k}</b>(<span class="num ${cls(cats[0].r)}">${spct(cats[0].r)}</span>), 가장 약한 곳은 <b>${cats[cats.length-1].k}</b>(<span class="num ${cls(cats[cats.length-1].r)}">${spct(cats[cats.length-1].r)}</span>)이었어요.</p>
      ${cats.map(g=>`<div class="secbar"><span>${g.k}</span><span class="track"><span class="fill" style="${g.r>=0?"left:50%":"right:50%"};width:${(Math.abs(g.r)/maxAbs*50).toFixed(1)}%;background:var(--${g.r>=0?"up":"down"})"></span></span><span class="num ${cls(g.r)}" style="text-align:right">${spct(g.r)}</span></div>`).join("")}`:""}
      <p style="margin-top:12px">원/달러 환율이 ${FX.base}원에서 ${FX.now}원이 됐어요. 원화로 바꾸면 <b class="num ${cls(c.fxC)}">${pctp(c.fxC)}</b>가 더해졌어요.</p>
      ${macroNightHtml(st, code, false)}

}

function zoneOf(x, v){ const i = x.zones.findIndex(z=> v < z[0]); return i<0 ? x.zones.length-1 : i; }
const ZONE_COLORS = ["var(--z0)","var(--z1)","var(--z2)","var(--z3)","var(--z4)"];
function zoneGaugeHtml(v, x, val){
  if(!okn(val)) return "";
  const span = x.max - x.min;
  const edges = [x.min, ...x.zones.map(z=>Math.min(z[0], x.max))];
  const cur = zoneOf(x, val);
  const pos = Math.max(0, Math.min(1, (val - x.min)/span))*100;
  const tickVals = edges.slice(1, -1);
  return `<div class="gauge">
      <span class="mk num" style="left:${pos.toFixed(1)}%">지금 ${fmtVal(v,val)}</span>
      <div class="bar">${x.zones.map((z,i)=>`<span style="width:${(((edges[i+1]-edges[i])/span)*100).toFixed(2)}%;background:${ZONE_COLORS[i%ZONE_COLORS.length]};opacity:${i===cur?1:.6}"${i===cur?' class="cur"':""}></span>`).join("")}</div>
      <div class="ticks num">${tickVals.map(t=>`<span style="left:${(((t-x.min)/span)*100).toFixed(1)}%">${t}</span>`).join("")}</div>
    </div>
    ${x.zones.map((z,i)=>{ const lo = i===0 ? null : x.zones[i-1][0], hi = z[0]===INF ? null : z[0];
      const u = v.unit; const range = lo===null ? `${hi}${u} 미만` : hi===null ? `${lo}${u} 이상` : `${lo}~${hi}${u}`;
      return `<div class="zone${i===cur?" on":""}"><span class="sw${i===cur?" cur":""}" style="background:${ZONE_COLORS[i%ZONE_COLORS.length]}"></span><div><b>${z[1]}</b><span class="zr num">${range}</span>${i===cur?' <span class="chip mine">지금</span>':""}<p>${z[2]}</p></div></div>`; }).join("")}
    ${x.note?`<p class="tiny muted" style="margin-top:6px">${x.note}</p>`:""}`;
}
function chainHtml(x){ return `<div class="chain">${x.chain.map((c,i)=>`<span class="${i===x.chain.length-1?"me":""}">${c}</span>${i<x.chain.length-1?"<i>→</i>":""}`).join("")}</div>`; }
function sensHtml(x){

    <p class="tiny muted" style="margin-top:8px">${pos.length?"내 계좌":"관심 ETF"} 기준이에요. 일반적인 경향이고, 항상 그렇게 움직이지는 않아요.</p></div>`;
}
function oneLine(v, x, val, prev){
  const z = x.zones[zoneOf(x,val)];
  const diff = prev!=null ? val - prev : null;
  const dtxt = (diff==null || !okn(diff)) ? "" : Math.abs(diff)<1e-9 ? " 지난번과 같아요." : ` 지난번보다 ${Math.abs(diff).toFixed(v.dec!=null?v.dec:1).replace(/\.?0+$/,"")}${v.unit==="%"?"%p":v.unit} ${diff>0?"올랐어요":"내려왔어요"}.`;

function isDstDate(ds){ const [y,m,d] = ds.split("-").map(Number); const r = dstRange(y); const md = m*100+d; return md >= r.start[0]*100+r.start[1] && md < r.end[0]*100+r.end[1]; }
function releaseKst(ind){
  const [ds, hm, tz] = ind.next; const [h, mi] = hm.split(":").map(Number);
  let utc;
  if(tz==="KST") utc = Date.UTC(...ds.split("-").map((v,i)=>i===1?+v-1:+v), h-9, mi);
  else { const off = isDstDate(ds) ? 4 : 5; const [y,m,d] = ds.split("-").map(Number); utc = Date.UTC(y, m-1, d, h+off, mi); }
  const k = parts(new Date(utc), "Asia/Seoul");
  const ampm = k.h<6 ? "새벽" : k.h<12 ? "오전" : k.h<18 ? "오후" : "밤";
  const h12 = k.h%12===0 ? 12 : k.h%12;
  const tlabel = k.h===0 ? `0:${pad(k.mi)} (자정)` : `${ampm} ${h12}:${pad(k.mi)}`;

function fmtVal(ind, v){ if(!okn(v)) return PEND; return ind.unit==="원" ? v.toLocaleString("ko-KR",{maximumFractionDigits:1})+"원" : `${v.toFixed(ind.dec!=null?ind.dec:(ind.unit==="%"?1:1))}${ind.unit}`; }
function sparkSvg(arr, h=56){
  const W=300, mn=Math.min(...arr), mx=Math.max(...arr), rg=(mx-mn)||1;
  const pts = arr.map((v,i)=>[i*(W/(arr.length-1)), h-6-(v-mn)/rg*(h-12)]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" height="${h}" role="img" aria-label="최근 추이"><path d="${d} L${W} ${h} L0 ${h} Z" fill="var(--accent)" opacity=".10"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/></svg>`;
}
function histBars(ind){

function surpriseText(ind){

const tw = (word, key) => `<button type="button" class="tword" data-tipk="${key||word}">${word}</button>`;
const HOWTO = {

const CALC = {
  avg(f){
    const q1 = numIn(f,"q1"), p1 = numIn(f,"p1"), q2 = numIn(f,"q2"), p2 = numIn(f,"p2");
    let now = numIn(f,"now"); if(!isFinite(now)) now = p2;
    if(!(now > 0)) return `<p class="small muted">현재가는 0보다 커야 해요.</p>`;
    if(![q1,p1,q2,p2].every(x=>isFinite(x)&&x>0)) return `<p class="small muted">네 칸을 모두 채우면 결과가 나와요.</p>`;
    const avg = (q1*p1 + q2*p2) / (q1+q2), q = q1+q2;
    return outRow("새 평단가", won(avg), true) +
      outRow("평단가 변화", `${won(p1)} → ${won(avg)} (${pctC(avg/p1-1)})`) +
      outRow("총 보유 수량", `${q.toLocaleString("ko-KR")}주`) +
      outRow("총 투자금", won(q*avg)) +
      outRow(`현재가(${won(now)}) 기준 수익률`, `${pctC(now/p1-1)} → ${pctC(now/avg-1)}`) +
      (now < avg ? outRow("본전까지 필요한 상승률", pctS(avg/now-1), true) : outRow("지금 상태", "평단가보다 높아요"));
  },
  goal(f){
    const avg = numIn(f,"avg"), now = numIn(f,"now"), t = numIn(f,"t")/100, q = numIn(f,"q");
    if(![avg,now].every(x=>isFinite(x)&&x>0) || !isFinite(t)) return `<p class="small muted">평단가, 현재가, 목표 수익률을 채우면 결과가 나와요.</p>`;
    const target = avg*(1+t), need = target/now - 1;
    let out = outRow("목표가", won(target), true) + outRow("지금 수익률", pctC(now/avg-1)) +
      outRow("목표까지 필요한 상승률", need > 0 ? pctS(need) : "이미 넘었어요", true);
    if(isFinite(q) && q > 0){ const gain = (target-avg)*q;
      out += outRow(`목표 달성 시 수익금 (${tw("세전")})`, won(gain)) +
        (gain > 0 ? outRow("일반계좌라면 세금 (15.4%)", `약 ${won(gain*0.154)}`) + outRow("세후 수익금", `약 ${won(gain*0.846)}`) : ""); }
    return out;
  },
  fx(f){
    const usd = numIn(f,"usd")/100, s = numIn(f,"s"), e = numIn(f,"e"), hc = numIn(f,"hc")/100, m = numIn(f,"m");
    if(!isFinite(usd) || ![s,e].every(x=>isFinite(x)&&x>0)) return `<p class="small muted">미국 수익률과 시작·끝 환율을 넣으면 결과가 나와요.</p>`;
    const fx = e/s - 1, unh = (1+usd)*(1+fx) - 1, hedge = usd - (isFinite(hc)?hc:0)*((isFinite(m)&&m>0?m:12)/12);
    const better = Math.abs(unh-hedge) < 0.0005 ? "거의 같아요" : unh > hedge ? "비H(환노출)가 유리했어요" : "H(환헤지)가 유리했어요";
    const be = (1+hedge)/(1+usd) - 1;
    return outRow("환율 변화", `${s.toLocaleString("ko-KR")}원 → ${e.toLocaleString("ko-KR")}원 (${pctC(fx)})`) +
      outRow("비H (환노출) 원화 수익률", pctC(unh), true) +
      outRow("H (환헤지) 수익률 · 추정", pctC(hedge), true) +
      outRow("이 경우", better) +
      outRow("둘이 같아지는 환율 변화", `${pctS(be)} (약 ${Math.round(s*(1+be)).toLocaleString("ko-KR")}원)`) +
      `<p class="tiny muted" style="margin-top:8px">환율 효과 = 미국 수익률에 환율 변화가 곱해져요. H는 환율 영향을 거의 없애는 대신 헤지 비용이 들어요. 실제 H 상품의 결과는 운용 방식에 따라 조금 달라요.</p>`;
  },
  tax(f){
    const g = numIn(f,"g")*10000;
    if(!isFinite(g) || g <= 0) return `<p class="small muted">한 해 동안 난 수익금을 넣으면 계좌별 세금을 비교해 줘요.</p>`;
    const gen = g*0.154, isa1 = Math.max(0,g-2e6)*0.099, isa2 = Math.max(0,g-4e6)*0.099, us = Math.max(0,g-2.5e6)*0.22;
    const rows = [["일반계좌 (국내 상장 해외 ETF)", gen],["ISA 일반형 (3년 유지 시)", isa1],["ISA 서민형 (3년 유지 시)", isa2],["해외 직접 투자 (QQQ 등)", us]];
    const min = Math.min(...rows.map(r=>r[1]));
    return rows.map(([k,v])=>outRow(v===min?`${k} · 가장 적음`:k, won(v), v===min)).join("") +
      outRow("연금저축·IRP", "지금은 0원 (받을 때 연금소득세 3.3~5.5%)") +
      (g > 2e7 ? `<p class="small" style="color:var(--warn);margin-top:8px">일반계좌에서 이자·배당을 합친 금융소득이 한 해 2,000만 원을 넘으면 종합과세 대상이 될 수 있어요.</p>` : "") +
      `<p class="tiny muted" style="margin-top:8px">수익 하나만 있을 때의 단순 계산이에요. ${tw("손익통산")}, 다른 금융소득, ${tw("과세표준기준가")}에 따라 실제 세금은 달라질 수 있어요.</p>`;
  }
};
function toolBody(k){

async function saveShare(){
  const msg = document.getElementById("saveMsg"); if(!shareBlob) return;
  const name = "밤낮ETF-아침브리핑.png";
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const d = await window.claude.use("downloads");
      if(d){ await d.save({filename:name, data:shareBlob}); if(msg) msg.textContent = "저장했어요."; return; }
    }
  }catch(err){ if(err && err.code==="declined"){ if(msg) msg.textContent = "저장을 취소했어요."; return; } }
  try{ const f = new File([shareBlob], name, {type:"image/png"}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){}
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(shareBlob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); if(msg) msg.textContent = "저장했어요."; return; }catch(e){}
  if(msg) msg.textContent = "여기서는 저장이 막혀 있어요. 이미지를 길게 눌러 저장해 주세요.";
}

const overlay = document.getElementById("overlay"), sheet = document.getElementById("sheet");

function openSheet(html, big){ clearTimeout(msnTimer); sheet.classList.toggle("big", !!big); if(!overlay.classList.contains("open")) lastFocus = document.activeElement; sheet.scrollTop = 0; sheet.innerHTML = `<button class="icon-btn close" type="button" data-close aria-label="닫기">✕</button>`+html; overlay.classList.add("open"); sheet.querySelector("[data-close]").focus(); }
function closeSheet(){ clearTimeout(msnTimer); overlay.classList.remove("open"); if(lastFocus) lastFocus.focus(); }
overlay.addEventListener("click", ev=>{ if(ev.target===overlay || ev.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && overlay.classList.contains("open")) closeSheet();
  const t = ev.target.closest && ev.target.closest("[data-evt]"); if(t && (ev.key==="Enter" || ev.key===" ")){ ev.preventDefault(); eventSheet(t.dataset.evt); } });

  Object.entries(X).forEach(([k,x])=>{ if(!p.specs.some(([kk])=>kk===k)) rows.push([k, x.v||"", x]); });
  return rows.map(([k,v,x])=> x
    ? `<div class="psx"><button type="button" class="psxbtn" data-pspec aria-expanded="false"><span>${k}</span><b>${v}<svg class="tri" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0h10L5 6z"/></svg></b></button>
       <div class="psxlist" hidden>${x.list.map(([n,sub,tag])=>`<div><b>${n}${tag?` <em>${tag}</em>`:""}</b>${sub?`<span>${sub}</span>`:""}</div>`).join("")}${x.note?`<p class="tiny muted">${x.note}</p>`:""}</div></div>`
    : `<div><span>${k}</span><b>${v}</b></div>`).join("");
}

const TRI = `<svg class="tri" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0h10L5 6z"/></svg>`;
function moneyAmt(m){ return m>=1000 ? `${Math.round(m/100).toLocaleString()}억 달러` : m>=100 ? `${(m/100).toFixed(1)}억 달러` : `${Math.round(m*100).toLocaleString()}만 달러`; }
function moneySegs(t){
  const M = MONEY[t]; if(!M) return null;
  const tot = M.segs.reduce((a,b)=>a+b[1],0);
  const oth = x => /^기타/.test(x[0]);
  const segs = M.segs.map(x=>({n:x[0], v:x[1], sub:x[2]||"", p:x[1]/tot*100})).sort((a,b)=> (oth([a.n])-oth([b.n])) || b.v-a.v);
  return {M, tot, segs};
}
function pctTxt(p){ return p<1 ? "1% 미만" : Math.round(p)+"%"; }
function moneyHtml(t){
  const d = moneySegs(t); if(!d) return "";
  const {M, tot, segs} = d, C = 2*Math.PI*44, gap = segs.length>1 ? 1.6 : 0;
  let off = 0;
  const arcs = segs.map((x,i)=>{ const len = C*x.p/100, a = `<circle r="44" cx="60" cy="60" stroke="var(--${i?"d"+Math.min(i+1,6):"pt"})" stroke-dasharray="${Math.max(len-gap,.6).toFixed(2)} ${(C-Math.max(len-gap,.6)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return a; }).join("");
  const top = segs[0];
  return `<div class="donut"><div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="사업별 매출 비중"><g transform="rotate(-90 60 60)">${arcs}</g></svg>
      <div class="ctr"><b>${pctTxt(top.p)}</b><i>${top.n}</i></div></div>
    <div class="leg">${segs.map((x,i)=>`<div><span class="dot" style="background:var(--${i?"d"+Math.min(i+1,6):"pt"})"></span><span class="nm">${x.n}${x.sub?`<small>${x.sub}</small>`:""}</span><span class="lv">${pctTxt(x.p)}${M.pct?"":`<small>${moneyAmt(x.v)}</small>`}</span></div>`).join("")}</div></div>
    <p class="mnote">${M.note}</p>
    <div class="msrc"><span class="tiny muted">${M.p}${M.pct?"":` · 합계 ${moneyAmt(tot)}`} · 출처</span>${M.src.map(([n,u])=>`<a class="tiny" href="${u}" target="_blank" rel="noopener">${n} ›</a>`).join("")}</div>`;
}
function coChainHtml(t){
  const c = CHAIN[t]; if(!c) return "";
  const lab = c.lab || ["만드는 곳·부품","사는 곳"];

}
function aboutAccs(t, co){
  const d = moneySegs(t), c = CHAIN[t];
  const acc = (k, title, prev, body) => `<div class="acc"><button type="button" class="accbtn" data-acc="${k}" aria-expanded="false"><b>${title}</b><span>${prev}</span>${TRI}</button><div class="accbody" hidden>${body}</div></div>`;
  const m = d ? acc("money","돈은 어디서 버나", `${d.segs[0].n} <em>${pctTxt(d.segs[0].p)}</em>`, moneyHtml(t))
    : acc("money","돈은 어디서 버나", "", `<p class="mnote" style="margin:0">${co.money}</p>`);
  const ch = c ? acc("chain","업계에서의 위치", c.role, coChainHtml(t))
    : (co.chain && co.chain!=="—" ? acc("chain","업계에서의 위치","",`<p class="mnote" style="margin:0">${co.chain}</p>`) : "");
  return `<div class="accs">${m}${ch}</div>`;
}
