/* ===================== 자동 점검 =====================
   숫자나 화면을 바꾸지 않아요. 이상해 보이는 값을 찾아 목록으로 보여주기만 해요. */
function runChecks(){
  const out = [];
  const add = (lv, area, msg, key) => out.push({lv, area, msg, key});
  const fin = x => typeof x==="number" && isFinite(x);
  const okDate = d => typeof d==="string" && /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(Date.parse(d+"T00:00:00Z"));
  const today = ymd(parts(now(),"Asia/Seoul"));
  const addDays = (d, n) => { const t = new Date(d+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
  const pctx = x => (x*100).toFixed(2)+"%";
  let n = 0; const tick = () => n++;
  const guard = (area, fn) => { try{ fn(); }catch(e){ add("err", area, "점검 중 오류가 났어요: "+e.message); } };

  guard("ETF", ()=>{
    const seen = new Set();
    ETFS.forEach(e=>{
      tick();
      if(seen.has(e.code)) add("err","ETF",`${e.name}: 종목코드 ${e.code}가 두 번 들어 있어요.`); seen.add(e.code);
      if(!(e.nav>0)) add("warn","ETF",`${e.name}: ${LV.kr?mdTxt(LV.kr)+" ":""}기준가가 아직 공개 전이라 원화 가격은 '확인 중'으로 보여요. 등락률은 계산돼요.`);
      const gap = e.close/e.nav - 1;
      if(fin(gap) && Math.abs(gap) > 0.03) add("warn","ETF",`${e.name}: 종가와 NAV 차이가 ${pctx(gap)}예요. 보통 1% 안쪽이라 값이 맞는지 확인이 필요해요.`);
      if(fin(e.prem) && Math.abs(e.prem) > 0.02) add("warn","ETF",`${e.name}: 장중 괴리율이 ${pctx(e.prem)}예요. LP가 있는 ETF는 보통 1% 안쪽이라 확인이 필요해요.`);
      const missing = e.h.filter(([t])=>!STOCKS[t]).map(([t])=>t);
      if(missing.length) add("err","ETF",`${e.name}: 구성종목 ${missing.join(", ")}의 시세가 없어요.`, "etf:"+e.code);
      const noInfo = e.h.filter(([t])=>!CO[t]).map(([t])=>t);
      if(noInfo.length) add("warn","ETF",`${e.name}: ${noInfo.join(", ")}의 회사 소개가 없어요.`);
      const wsum = e.h.reduce((a,[,w])=>a+w,0) + (e.rest ? e.rest.w : 0) + (e.cash||0);
      if(Math.abs(wsum-1) > 0.03) add("warn","ETF",`${e.name}: 비중을 모두 더하면 ${(wsum*100).toFixed(1)}%예요. 100%에 가까워야 해요.`);
      if(e.rest && e.rest.n && e.rest.n < e.h.length) add("warn","ETF",`${e.name}: 전체 종목 수(${e.rest.n})가 표시한 종목 수(${e.h.length})보다 적어요.`);
      const c = calc(e);
      if(!fin(c.total)) add("err","ETF",`${e.name}: 추정 계산 결과가 숫자가 아니에요.`, "etf:"+e.code);
      else if(Math.abs(c.total) > 0.15) add("warn","ETF",`${e.name}: 하룻밤 추정 변화가 ${pctx(c.total)}예요. 너무 커서 입력값 확인이 필요해요.`);
    });
  });
  guard("시세", ()=>{
    const used = new Set(ETFS.flatMap(e=>e.h.map(([t])=>t)));
    Object.entries(STOCKS).forEach(([t,[name,price,r]])=>{
      tick();
      if(!used.has(t) && !okn(price)) return;  // ETF에 안 담긴 회사는 시세가 없을 수 있어요
      if(!(price>0)) add("err","시세",`${name}(${t}): 가격이 비어 있거나 0이에요.`, "stock:"+t);
      if(!fin(r)) add("err","시세",`${name}(${t}): 등락률이 숫자가 아니에요.`, "stock:"+t);
      else if(Math.abs(r) > 0.3) add("warn","시세",`${name}(${t}): 하루 등락률이 ${pctx(r)}예요. 실제로 크게 움직였는지 확인이 필요해요.`);
    });
    tick();
    if(!(FX.now>0 && FX.base>0)) add("err","환율","원/달러 환율이 비어 있어요.", "fx");
    else if(Math.abs(FX.now/FX.base-1) > 0.03) add("warn","환율",`원/달러 환율이 기준보다 ${pctx(FX.now/FX.base-1)} 움직였어요. 하루 변동으로는 커서 확인이 필요해요.`);
    Object.entries(FUT).forEach(([k,v])=>{ tick(); if(!fin(v) || Math.abs(v) > 0.1) add("warn","미국 지수",`${({nq:"나스닥100(QQQ)",es:"S&P500(SPY)",sox:"반도체(SOXQ)",semi:"반도체(SMH)",div:"배당(SCHD)"})[k]||k} 변화 ${fin(v)?pctx(v):"값 없음"}가 이상해요.`); });
    tick();
    if(IND.usdkrw && Math.abs(IND.usdkrw.now - FX.now) > 0.05) add("warn","환율",`매크로 지표의 원/달러(${IND.usdkrw.now})와 ETF 계산에 쓰는 환율(${FX.now})이 달라요.`);
  });
  guard("매크로 지표", ()=>{
    Object.entries(IND).forEach(([k,v])=>{
      tick();
      const nm = v.name || k;
      if(!v.name || v.unit==null) add("err","매크로 지표",`${k}: 이름이나 단위가 비어 있어요.`);
      const cur = curVal(v);
      if(!fin(cur)){ add("err","매크로 지표",`${nm}: 현재 값이 숫자가 아니에요.`, "ind:"+k); return; }
      if(v.unit==="%" && (cur < -50 || cur > 100)) add("warn","매크로 지표",`${nm}: ${cur}%는 범위를 벗어난 값 같아요.`);
      if(v.g==="mkt"){
        if(Array.isArray(v.spark) && v.spark.length){
          const last = v.spark[v.spark.length-1];
          if(Math.abs(last - v.now) > Math.max(0.011, Math.abs(v.now)*0.0005)) add("warn","매크로 지표",`${nm}: 작은 그래프의 마지막 값(${last})이 현재 값(${v.now})과 달라요.`);
          if(fin(v.chg) && v.spark.length > 1){
            const d = v.now - v.spark[v.spark.length-2], tol = Math.max(0.015, Math.abs(v.now)*0.0004);
            if(Math.abs(d - v.chg) > tol) add("warn","매크로 지표",`${nm}: 전일 대비(${v.chg})가 그래프로 계산한 변화(${d.toFixed(2)})와 달라요.`);
          }
        }
      } else {
        if(!v.org) add("warn","매크로 지표",`${nm}: 발표 기관이 비어 있어요.`);
        if(!/^https:\/\//.test(v.src||"")) add("warn","매크로 지표",`${nm}: 원문 링크가 없거나 https가 아니에요.`);
        const L = v.last || {};
        if(!fin(L.p)) add("warn","매크로 지표",`${nm}: 이전 값이 비어 있어요.`);
        if(Array.isArray(v.hist) && v.hist.length >= 2){
          const h = v.hist;
          if(Math.abs(h[h.length-1] - L.a) > 1e-9) add("warn","매크로 지표",`${nm}: 최근 흐름의 마지막 값(${h[h.length-1]})이 실제 발표값(${L.a})과 달라요.`);
          if(fin(L.p) && Math.abs(h[h.length-2] - L.p) > 1e-9) add("warn","매크로 지표",`${nm}: 최근 흐름의 직전 값(${h[h.length-2]})이 '이전' 값(${L.p})과 달라요.`);
        }
        if(Array.isArray(v.next) && v.next.length===3){
          if(!okDate(v.next[0])) add("err","매크로 지표",`${nm}: 다음 발표일 형식이 잘못됐어요.`);
          else {
            const [h,mi] = v.next[1].split(":").map(Number);
            if(v.next[2]==="ET"){
              const off = isDstDate(v.next[0]) ? 4 : 5, [y,m,d] = v.next[0].split("-").map(Number);
              const et = parts(new Date(Date.UTC(y,m-1,d,h+off,mi)), "America/New_York");
              if(et.h!==h || et.mi!==mi) add("err","매크로 지표",`${nm}: 서머타임 계산이 어긋나 한국 시간 표시가 1시간 틀릴 수 있어요.`);
            }
            const r = releaseKst(v);
            if(r.ymd < today) add("warn","매크로 지표",`${nm}: 다음 발표일(${r.label})이 이미 지났어요. 새 결과와 다음 일정으로 바꿔야 해요.`);
            else if(r.ymd > addDays(today, 120)) add("warn","매크로 지표",`${nm}: 다음 발표일이 4달 넘게 남았어요. 일정이 맞는지 확인이 필요해요.`);
          }
        }
      }
      const x = IND_X[k];
      if(x && x.zones){
        const th = x.zones.map(z=>z[0]);
        if(th.some((t,i)=>i>0 && !(t>th[i-1]))) add("err","매크로 지표",`${nm}: 구간 기준값이 작은 것부터 순서대로가 아니에요.`);
        if(fin(x.min) && fin(x.max) && (cur < x.min || cur > x.max)) add("warn","매크로 지표",`${nm}: 현재 값 ${cur}이 구간 막대 범위(${x.min}~${x.max}) 밖이에요.`);
      }
      const t = TEN[k];
      if(t){
        if(!(t[0][0] > t[1][0])) add("err","매크로 지표",`${nm}: 10년 최고값이 최저값보다 작아요.`);
        if(cur > t[0][0]) add("warn","매크로 지표",`${nm}: 현재 값 ${cur}이 10년 최고(${t[0][0]}, ${t[0][1]})보다 높아요. 기록이 바뀌었는지, 값이 틀렸는지 확인이 필요해요.`);
        if(cur < t[1][0]) add("warn","매크로 지표",`${nm}: 현재 값 ${cur}이 10년 최저(${t[1][0]}, ${t[1][1]})보다 낮아요. 기록이 바뀌었는지, 값이 틀렸는지 확인이 필요해요.`);
      }
    });
    tick();
    if(IND.spread && IND.us10y && IND.us2y){
      const calcd = IND.us10y.now - IND.us2y.now;
      if(Math.abs(calcd - IND.spread.now) > 0.02) add("warn","매크로 지표",`장단기 금리차(${IND.spread.now})가 10년물−2년물로 계산한 값(${calcd.toFixed(2)})과 달라요.`);
    }
    tick();
    if(IND.bok && BOK_REAL.length){ const last = BOK_REAL[BOK_REAL.length-1][1]; if(Math.abs(last - IND.bok.last.a) > 1e-9) add("warn","매크로 지표",`한국은행 기준금리 차트 마지막 값(${last}%)과 지금 값(${IND.bok.last.a}%)이 달라요.`); }
    Object.entries(LINKS).forEach(([k,v])=>{ tick(); const all = [...(v.ev||[]),...(v.co||[]),...(v.ll||[])];
      if(!IND[k]) add("err","연관성",`연관성 목록에 없는 지표(${k})가 있어요.`);
      all.filter(l=>!IND[l.to]).forEach(l=>add("err","연관성",`${IND[k]?IND[k].name:k}: 연결된 지표 ${l.to}가 없어요.`)); });
    Object.entries(IND_GROUPS).forEach(([g,v])=>{ tick(); v.keys.filter(k=>!IND[k]).forEach(k=>add("err","매크로 지표",`${v.title} 묶음에 없는 지표(${k})가 들어 있어요.`)); });
  });
  guard("일정", ()=>{
    const held = new Set(ETFS.flatMap(e=>e.h.map(([t])=>t)));
    EVENTS.forEach(ev=>{
      tick();
      if(!okDate(ev.d)){ add("err","일정",`${ev.title}: 날짜 형식이 잘못됐어요.`); return; }
      if(ev.done && ev.d > today) add("err","일정",`${ev.title}: 아직 오지 않은 날(${ev.d})인데 '완료'로 표시돼 있어요.`);
      if(!ev.done && ev.d < today) add("warn","일정",`${ev.title}: 지난 일정(${ev.d})인데 '완료' 표시가 없어요.`);
      if(!held.has(ev.t)) add("warn","일정",`${ev.title}: ${ev.t}는 어떤 ETF에도 들어 있지 않아요.`);
    });
    Object.entries(DIST).forEach(([code,d])=>{
      tick();
      const e = ETFS.find(x=>x.code===code); const nm = e ? e.name : code;
      if(!e) add("warn","분배금",`분배금 정보에 없는 ETF(${code})가 있어요.`);
      d.hist.forEach(([dt,amt])=>{ if(!okDate(dt) || !(amt>=0)) add("err","분배금",`${nm}: 지난 분배금 기록(${dt})이 잘못됐어요.`); });
      if(d.next){
        if(!okDate(d.next.rec) || !okDate(d.next.pay)) add("err","분배금",`${nm}: 다음 분배 날짜 형식이 잘못됐어요.`);
        else { if(d.next.rec < today) add("warn","분배금",`${nm}: 다음 기준일(${d.next.rec})이 이미 지났어요.`);
               if(d.next.pay <= d.next.rec) add("err","분배금",`${nm}: 지급일이 기준일보다 빨라요.`); }
      }
    });
  });
  guard("휴장일", ()=>{
    [["한국",KRX_HOL],["미국",US_HOL]].forEach(([nm,list])=>{
      tick();
      list.forEach((h,i)=>{
        if(!okDate(h[0])) add("err","휴장일",`${nm} 휴장일 ${h[0]}: 날짜 형식이 잘못됐어요.`);
        else { const wd = new Date(h[0]+"T00:00:00Z").getUTCDay(); if(wd===0||wd===6) add("warn","휴장일",`${nm} 휴장일 ${h[0]}(${h[1]})이 주말이에요. 원래 쉬는 날이라 목록에 필요 없어요.`); }
        if(i>0 && !(h[0] > list[i-1][0])) add("err","휴장일",`${nm} 휴장일 목록이 날짜 순서가 아니거나 겹쳐요 (${h[0]}).`);
      });
      const last = list[list.length-1][0];
      if(last < addDays(today, 60)) add("warn","휴장일",`${nm} 휴장일 목록이 ${last}까지만 있어요. 다음 해 일정을 넣어야 해요.`);
    });
  });
  return {items: out, count: n, at: now()};
}
function refreshFlags(){
  FLAG = {etf:new Set(), stock:new Set(), ind:new Set()};
  let items = [];
  try{ items = runChecks().items; }catch(e){ return; }
  const next = {etf:new Set(), stock:new Set(), ind:new Set()};
  items.filter(x=>x.lv==="err" && x.key).forEach(x=>{
    if(x.key==="fx") ETFS.forEach(e=>next.etf.add(e.code));
    else { const [t,id] = x.key.split(":"); if(next[t]) next[t].add(id); }
  });
  FLAG = next;
}
function checkSummary(){
  const r = runChecks(); const e = r.items.filter(x=>x.lv==="err").length, w = r.items.filter(x=>x.lv==="warn").length;
  return {r, e, w};
}
function viewCheck(){
  const {r, e, w} = checkSummary();
  const groups = {};
  r.items.forEach(x=>{ (groups[x.area] = groups[x.area] || []).push(x); });
  const k = parts(r.at, "Asia/Seoul");
  const head = e ? `확인이 필요한 오류 ${e}건${w?` · 주의 ${w}건`:""}` : w ? `오류 없음 · 주의 ${w}건` : "모두 정상이에요";
  return `<section class="card">
    <h2 style="margin:0 0 4px">자동 점검</h2>
    <p class="small muted" style="margin:0 0 14px">${k.m}/${k.d} ${pad(k.h)}:${pad(k.mi)} 기준 · 항목 ${r.count}개를 확인했어요</p>
    <div class="chk-sum ${e?"bad":w?"warn":"good"}">${head}</div>
    <p class="small" style="margin:14px 0 0">이 점검은 <b>숫자나 화면을 바꾸지 않아요.</b> 앱에 들어 있는 자료끼리 맞는지, 범위를 벗어난 값이 없는지, 지난 일정이 그대로 남아 있지 않은지 확인해서 목록으로만 보여줘요. 고치는 일은 사람이 확인한 뒤에 해요.</p>
  </section>
  ${Object.entries(groups).map(([a,list])=>`<section class="card"><h3 style="margin:0 0 8px">${a} <span class="small muted" style="font-weight:400">${list.length}건</span></h3>
    ${list.map(x=>`<div class="chk-row"><span class="chk-lv ${x.lv}">${x.lv==="err"?"오류":"주의"}</span><span>${x.msg}</span></div>`).join("")}</section>`).join("")}
  <p class="tiny muted" style="margin:8px 4px 0">지금은 샘플 숫자라 실제 시세와 맞지 않는 항목이 나올 수 있어요. 실제 데이터가 연결되면 같은 점검이 매번 새 데이터에 돌아가요.</p>`;
}

/* ===================== 라우팅 ===================== */
function route(){ const h = (location.hash||"").replace("#",""); return h || "main"; }
function go(name){ if(location.hash !== "#"+name) location.hash = name; else render(); }
/* 아래로 스크롤하면 시계·탭을 접고, 위로 올리면 다시 보여요 */
const topEl = document.querySelector(".top");
let lastY = window.scrollY, scrollTick = false;
function setCompact(on){ topEl.classList.toggle("compact", on); }
window.addEventListener("scroll", ()=>{
  if(scrollTick) return; scrollTick = true;
  requestAnimationFrame(()=>{
    const y = window.scrollY, dy = y - lastY;
    if(y < 80) setCompact(false);
    else if(dy > 6) setCompact(true);
    else if(dy < -6) setCompact(false);
    if(Math.abs(dy) > 6 || y < 80) lastY = y;
    scrollTick = false;
  });
}, {passive:true});
let lastRoute = null;
function render(){
  refreshFlags();
  if(route() !== lastRoute){ lastRoute = route(); setCompact(false); lastY = window.scrollY; }
  const st = renderTop();
  const r = route();
  let html;
  const inA = r==="macro" || r.startsWith("macro-");
  const inEtf = !(r==="main" || inA || r==="check");
  document.querySelector(".tabs").hidden = !inEtf;
  document.getElementById("backMain").hidden = (r==="main");
  document.getElementById("clocks").hidden = (r==="main");
  document.getElementById("protoBanner").hidden = (r==="main");
  document.getElementById("previewBox").hidden = (r==="main");
  document.getElementById("discLine").hidden = (r==="main");
  document.querySelector(".top").classList.toggle("bare", r==="main");
  document.getElementById("brandTitle").innerHTML = r==="main" ? "" : r==="check" ? "자동 <span>점검</span>" : (inA ? "매크로 <span>지표</span>" : "밤낮 <span>ETF</span>");
  if(r==="main") html = viewMain(st);
  else if(r==="macro") html = viewMacro(st);
  else if(r.startsWith("macro-")) html = viewMacroGroup(r.slice(6), st);
  else if(r.startsWith("etf-")) html = viewEtf(r.slice(4), st);
  else if(r==="calendar") html = viewCalendar();
  else if(r==="portfolio") html = viewPortfolio();
  else if(r==="news") html = viewNews();
  else if(r==="guide") html = viewGuide();
  else if(r==="check") html = viewCheck();
  else html = viewHome(st);
  document.getElementById("view").innerHTML = html;
  const tabKey = r.startsWith("etf-") ? "home" : r;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current", b.dataset.go===tabKey ? "page" : "false"));
  const hq = document.getElementById("homeQ");
  if(hq) hq.addEventListener("input", ev=>{
    homeQuery = ev.target.value;
    document.getElementById("homeList").innerHTML = homeListHtml(st);
    const box = hq.parentElement; let cb = box.querySelector("[data-clearq]");
    if(homeQuery && !cb){ box.insertAdjacentHTML("beforeend", `<button class="clear" type="button" data-clearq aria-label="검색어 지우기">✕</button>`); }
    if(!homeQuery && cb) cb.remove();
  });
  const f = document.getElementById("addForm");
  if(f) f.addEventListener("submit", ev=>{ ev.preventDefault();
    const code = document.getElementById("fCode").value;
    const qty = +document.getElementById("fQty").value || null, buy = +document.getElementById("fBuy").value || null, inav = +document.getElementById("fInav").value || null;
    const msg = document.getElementById("addMsg");
    if((buy || inav) && !qty){ msg.textContent = "매수가나 iNAV를 넣으려면 수량도 같이 넣어주세요."; return; }
    if(exampleHoldings){ holdings = []; exampleHoldings = false; }
    if(!qty && holdings.some(h=>h.code===code)){ msg.textContent = "이미 추가된 ETF예요."; return; }
    holdings.push({code, qty, buy, buyInav: inav});
    store.set("holdings", holdings); render(); });
}
window.addEventListener("hashchange", ()=>{ showAll=false; render(); window.scrollTo(0,0); });

const SPLASH_IN = `<div class="sp-in"><div class="wordmark">GNOMON</div><div class="motto sp-motto">Money wins. Here’s to us.<span class="cite">— <i>Succession</i></span></div><div class="sp-hint">눌러서 시작</div></div>`;
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const flyTo = (el, target) => { const a = el.getBoundingClientRect(), b = target.getBoundingClientRect();
  const sy = parseFloat((getComputedStyle(el).scale||"").split(" ")[1]) || 1;
  const dx = (b.left+b.width/2)-(a.left+a.width/2), dy = ((b.top+b.height/2)-(a.top+a.height/2))/sy, k = b.width/a.width;
  return `translate(${dx}px,${dy}px) scale(${k})`; };
function bindSplash(sp){
  let done = false;
  const fade = () => { sp.classList.add("hide"); setTimeout(()=>sp.remove(), 600); };
  const hide = () => {
    if(done) return; done = true;
    const main = document.querySelector(".landing.main");
    const tw = main && main.querySelector(".wordmark"), tm = main && main.querySelector(".mmotto");
    const sw = sp.querySelector(".wordmark"), sm = sp.querySelector(".sp-motto");
    if(!tw || !tm || !sw || !sm || reduceMotion()){ fade(); return; }
    window.scrollTo(0,0);
    main.classList.remove("cards-out");
    main.classList.add("intro","pre");
    sp.classList.add("fly");
    const tW = flyTo(sw, tw), tM = flyTo(sm, tm);
    requestAnimationFrame(()=>{ sw.style.transform = tW; sm.style.transform = tM; });
    setTimeout(()=>{ main.classList.remove("pre"); main.classList.add("cards-in"); }, 450);
    setTimeout(()=>{ main.classList.remove("intro"); sp.remove(); }, 900);
    setTimeout(()=>{ main.classList.remove("cards-in"); }, 1600);
  };
  sp.addEventListener("click", hide);
  sp.addEventListener("keydown", e=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); hide(); } });
  sp.focus();
}
function reopenSplash(){
  if(document.getElementById("splash")) return;
  const main = document.querySelector(".landing.main");
  const sp = document.createElement("div");
  sp.className = "splash back"; sp.id = "splash"; sp.tabIndex = 0;
  sp.setAttribute("role","button"); sp.setAttribute("aria-label","GNOMON 노몬, 눌러서 시작");
  sp.innerHTML = SPLASH_IN;
  if(!main || reduceMotion()){ document.body.appendChild(sp); bindSplash(sp); return; }
  window.scrollTo(0,0);
  sp.classList.add("fly");
  document.body.appendChild(sp);
  const sw = sp.querySelector(".wordmark"), sm = sp.querySelector(".sp-motto");
  sw.style.transition = sm.style.transition = "none";
  sw.style.transform = flyTo(sw, main.querySelector(".wordmark"));
  sm.style.transform = flyTo(sm, main.querySelector(".mmotto"));
  main.classList.add("intro","cards-out");
  void sp.offsetWidth;
  sw.style.transition = sm.style.transition = "";
  requestAnimationFrame(()=>{ sw.style.transform = ""; sm.style.transform = ""; sp.classList.add("solid"); });
  setTimeout(()=>{ sp.classList.remove("fly","solid"); main.classList.remove("intro","cards-out"); bindSplash(sp); }, 900);
}
(function(){ const sp = document.getElementById("splash"); if(sp) bindSplash(sp); })();
document.addEventListener("click", ev=>{ if(ev.target.closest(".landing.main .mlogo")) reopenSplash(); });
document.addEventListener("click", ev=>{
  const el = ev.target.closest("[data-go],[data-etf],[data-star],[data-sort],[data-toggle-all],[data-stock],[data-term],[data-cal],[data-del],[data-clearq],[data-copy],[data-import],[data-tipok],[data-brief],[data-news],[data-howto],[data-holi],[data-ind],[data-share],[data-saveimg],[data-lh],[data-jump],[data-map],[data-mh],[data-cp],[data-tool],[data-tipk],[data-howt],[data-fxfill],[data-evt],[data-pcat],[data-pitem],[data-pspec],[data-mstep],[data-mplay],[data-mtap],[data-acc]");
  if(!el || el.closest("#sheet [data-close]")) return;
  if(el.dataset.share!==undefined){ openShare(el.dataset.share || null); return; }
  if(el.dataset.saveimg!==undefined){ saveShare(); return; }
  if(el.dataset.tipk){ ev.preventDefault(); const nx = el.nextElementSibling;
    if(nx && nx.classList.contains("tipline")){ nx.remove(); el.classList.remove("on"); return; }
    el.insertAdjacentHTML("afterend", `<span class="tipline"><b>${el.dataset.tipk}</b> ${TIP[el.dataset.tipk]||GLOSS[el.dataset.tipk]||""}</span>`); el.classList.add("on"); return; }
  if(el.dataset.fxfill!==undefined){ const f = document.querySelector('[data-calc="fx"]'); const e = f && f.querySelector('[name="e"]'); if(e){ e.value = FX.now; const o = document.getElementById("calcOut"); if(o) o.innerHTML = CALC.fx(f); e.focus(); } return; }
  if(el.dataset.howt){ const b = document.getElementById("howBox"); if(b){ b.hidden = !b.hidden; el.textContent = b.hidden ? "사용법 보기" : "사용법 닫기"; el.setAttribute("aria-expanded", String(!b.hidden)); } return; }
  if(el.dataset.tool){ openTool(el.dataset.tool); return; }
  if(el.dataset.cp){ chartP[el.dataset.ck] = el.dataset.cp; const b = document.getElementById("chartBox"); if(b) b.innerHTML = chartHtml(el.dataset.ck); return; }
  if(el.dataset.map){ go("macro-map-"+el.dataset.map); return; }
  if(el.dataset.mh){ mapH = el.dataset.mh; render(); return; }
  if(el.dataset.jump){ const t = document.getElementById(el.dataset.jump); if(t) t.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(el.dataset.lh){ const box = document.getElementById("lnk"); if(box) box.innerHTML = linksHtml(el.dataset.lk, el.dataset.lh); return; }
  if(el.dataset.ind){ indSheet(el.dataset.ind, el.dataset.from, el.dataset.prev); return; }
  if(el.dataset.holi){ holiSheet(el.dataset.holi); return; }
  if(el.dataset.howto!==undefined){ openSheet(howtoHtml(), true); return; }
  if(el.dataset.brief){ openBrief(el.dataset.brief); return; }
  if(el.dataset.news){ newsFilter = el.dataset.news; render(); return; }
  if(el.dataset.tipok!==undefined){ store.set("tipSeen", true); render(); return; }
  if(el.dataset.copy!==undefined){
    const ta = document.getElementById("bkOut"); const msg = document.getElementById("copyMsg");
    try{ navigator.clipboard.writeText(ta.value).then(()=>{ msg.textContent="복사했어요"; }, ()=>{ ta.select(); msg.textContent="복사가 막혀 있어요. 코드를 길게 눌러 직접 복사해 주세요"; }); }
    catch(e){ ta.select(); msg.textContent="복사가 막혀 있어요. 코드를 길게 눌러 직접 복사해 주세요"; }
    return;
  }
  if(el.dataset.import!==undefined){
    const msg = document.getElementById("impMsg");
    try{
      const arr = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("bkIn").value.trim()))));
      if(!Array.isArray(arr) || !arr.every(h=>h && ETFS.some(e=>e.code===h.code))) throw 0;
      holdings = arr.map(h=>({code:h.code, qty:h.qty?+h.qty:null, buy:h.buy?+h.buy:null, buyInav:h.buyInav?+h.buyInav:null}));
      exampleHoldings = false; store.set("holdings", holdings); render();
    }catch(e){ msg.textContent = "코드를 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여넣었는지 확인해 주세요."; }
    return;
  }
  if(el.dataset.clearq!==undefined){ homeQuery=""; render(); const i=document.getElementById("homeQ"); if(i) i.focus(); return; }
  if(el.dataset.term){ openSheet(`<h3 id="sheetTitle">${el.dataset.term}</h3><p>${GLOSS[el.dataset.term]||""}</p>`); return; }
  if(el.dataset.go){ go(el.dataset.go); if(overlay.classList.contains("open")) closeSheet(); return; }
  if(el.dataset.etf){ go("etf-"+el.dataset.etf); return; }
  if(el.dataset.star){ const c = el.dataset.star; stars = stars.includes(c) ? stars.filter(x=>x!==c) : [...stars,c]; store.set("stars",stars); render(); return; }
  if(el.dataset.sort){ sortKey = el.dataset.sort; render(); return; }
  if(el.dataset.toggleAll!==undefined){ showAll=!showAll; render(); return; }
  if(el.dataset.stock){ stockSheet(el.dataset.stock, el.dataset.from, el.dataset.fromev, el.dataset.fromco); return; }
  if(el.dataset.cal){ calFilter = el.dataset.cal; render(); return; }
  if(el.dataset.pcat!==undefined){ const box = el.closest(".prod"); box.querySelectorAll(".pc").forEach(b=>{ const on = b===el; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    box.querySelectorAll(".pgroup").forEach(g=>g.hidden = g.dataset.pg!==el.dataset.pcat); return; }
  if(el.dataset.mstep!==undefined){ missionShow(el.closest(".msn"), +el.dataset.mstep, false); return; }
  if(el.dataset.mplay!==undefined){ ev.stopPropagation(); missionShow(el.closest(".msn"), 0, true); return; }
  if(el.dataset.mtap!==undefined){ const box = el.closest(".msn"), r = el.getBoundingClientRect(), x = (ev.clientX||r.left+r.width)-r.left;
    missionShow(box, (+box.dataset.i||0) + (x < r.width/3 ? -1 : 1), false); return; }
  if(el.dataset.acc!==undefined){ const box = el.parentElement, open = el.getAttribute("aria-expanded")!=="true";
    el.setAttribute("aria-expanded", open); box.classList.toggle("open", open); box.querySelector(".accbody").hidden = !open; return; }
  if(el.dataset.pspec!==undefined){ const box = el.parentElement, open = el.getAttribute("aria-expanded")!=="true";
    el.setAttribute("aria-expanded", open); box.classList.toggle("open", open); box.querySelector(".psxlist").hidden = !open; return; }
  if(el.dataset.pitem!==undefined){ const item = el.closest(".pitem"), open = el.getAttribute("aria-expanded")!=="true";
    el.closest(".prod").querySelectorAll(".pitem").forEach(x=>{ x.querySelector(".pbody").hidden = true; x.querySelector(".phead").setAttribute("aria-expanded","false"); x.classList.remove("open"); });
    if(open){ item.querySelector(".pbody").hidden = false; el.setAttribute("aria-expanded","true"); item.classList.add("open"); }
    return; }
  if(el.dataset.evt){ if(ev.target.closest("a")) return; eventSheet(el.dataset.evt); return; }
  if(el.dataset.del!==undefined){ holdings.splice(+el.dataset.del,1); exampleHoldings=false; store.set("holdings",holdings); render(); return; }
});

document.getElementById("simSel").addEventListener("change", ev=>{ simHM = ev.target.value; render(); });
