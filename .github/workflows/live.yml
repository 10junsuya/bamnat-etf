name: 밤사이 계산용 숫자 받아오기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_live.py", ".github/workflows/live.yml"]
  schedule:
    - cron: "17 21 * * 1-5"   # 한국 06:17 (미국 정규장 마감 뒤)
    - cron: "47 22 * * 1-5"   # 한국 07:47 (아침 브리핑 전)
    - cron: "37 4 * * 1-5"    # 한국 13:37 (공공데이터 기준가 올라온 뒤)
    - cron: "7 9 * * 1-5"     # 한국 18:07 (한국 장 마감·환율 반영 뒤)

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_live.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/live.json /tmp/new.json
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/new.json data/live.json
            python scripts/check_data.py --embed
            git add data/live.json index.html
            git diff --cached --quiet && exit 0
            git commit -q -m "밤사이 계산용 숫자 업데이트"
            git push -q && exit 0
            sleep $((i*7))
          done
          exit 1
