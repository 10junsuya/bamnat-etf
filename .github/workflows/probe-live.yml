name: 실시간 서버 창고 기록 보기 (손으로 실행)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 2분 일 기록 5분 동안 보기 (숫자만)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 300 npx --yes wrangler@4 tail gnomon-live --format json > tail.txt 2>/dev/null || true
          grep -o '"gnomon[^}]*}' tail.txt | grep -v blocked | head -20 || true
          grep -o '"outcome":"[a-zA-Z]*"' tail.txt | sort | uniq -c || true
          grep -o '"cpuTime":[0-9]*\|"wallTime":[0-9]*' tail.txt | head -10 || true
