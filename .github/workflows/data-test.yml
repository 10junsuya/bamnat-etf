name: 데이터 연결 테스트

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_test.py"
      - ".github/workflows/data-test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 실제 데이터 받아오기
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python scripts/fetch_test.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/test.json
          git diff --cached --quiet || git commit -m "데이터 테스트 결과 업데이트"
          git push
